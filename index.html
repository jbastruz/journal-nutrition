  .recToggle{display:flex;align-items:center;gap:10px;margin:2px 0 14px;
             color:var(--doux);font-size:13px;cursor:pointer}
  /* Case à cocher redessinée. `accent-color` ne teinte QUE l'état coché :
     décochée, la case restait le rectangle blanc du système, c'est-à-dire
     l'objet le plus lumineux d'une fiche en verre sombre — l'œil y allait
     avant d'aller au nom du plat. Elle devient un creux, comme les champs de
     saisie, et se remplit du même verre émeraude que tout ce qui est
     sélectionné ailleurs. */
  .recToggle input{appearance:none;-webkit-appearance:none;
             width:22px;height:22px;flex:none;margin:0;border-radius:7px;
             border:1px solid rgba(255,255,255,.18);
             background:var(--champ-verre);box-shadow:var(--champ-creux);
             display:grid;place-items:center;cursor:pointer;
             transition:background .22s var(--ressort),
                        border-color .22s var(--ressort)}
  /* Le crochet est dessiné en bordures plutôt qu'en glyphe : un « ✓ » de
     police change de forme et de chasse d'un système à l'autre, et se
     retrouve décentré dans la case une fois sur deux. */
  .recToggle input::after{content:'';width:10px;height:5.5px;
             border-left:2px solid var(--sur-accent);
             border-bottom:2px solid var(--sur-accent);
             transform:rotate(-45deg) translate(1px,-1px);
             opacity:0;transition:opacity .16s ease}
  .recToggle input:checked{background:var(--verre-accent);
             border-color:rgba(255,255,255,.3);
             box-shadow:inset 0 1px 0 rgba(255,255,255,.4),
                        0 2px 8px rgba(16,185,129,.3)}
  .recToggle input:checked::after{opacity:1}
  .recToggle input:focus-visible{outline:2px solid var(--accent);
             outline-offset:2px}
  /* Fiche de gestion des récurrents */
  /* Les plats en routine étaient des CARTES FLOTTANTES, une par plat. C'est le
     défaut déjà corrigé sur le journal — cinq plats faisaient cinq objets
     identiques sans lien visible, et rien ne disait qu'ils formaient un
     ensemble. Ils deviennent des lignes d'une liste groupée, avec le même
     séparateur décalé à 15 px : une seule carte, cinq entrées. Corrigé le
     13/09/2026, par cohérence avec le journal et pas pour l'ornement. */
  .recListe{list-style:none;padding:0;margin:0;background:var(--carte);
            border-radius:var(--r-l);overflow:hidden;box-shadow:var(--ombre)}
  .recItem{list-style:none;background:none;border:none;
           border-radius:0;padding:13px 15px;margin:0}
  .recItem + .recItem{
    background-image:linear-gradient(var(--bord),var(--bord));
    background-repeat:no-repeat;
    background-size:calc(100% - 15px) 1px;
    background-position:15px 0}
  .recItem.off{opacity:.5}
  /* `wrap` : quatre contrôles (portion, repas, pause, retrait) ne tiennent pas
     sur une ligne de 360 px. Sans lui, le dernier sortait de la carte —
     exactement le défaut déjà corrigé sur le rail d'actions rapides. */
  .recItem .rang{display:flex;align-items:center;gap:8px;margin-top:8px;
                 flex-wrap:wrap}
  .recItem input{width:74px;padding:8px;font-size:16px;text-align:center;
                 border-radius:var(--r-s);border:1px solid rgba(255,255,255,.1);background:var(--champ-verre);
                 color:var(--txt);-moz-appearance:textfield;appearance:textfield}
  .recItem input::-webkit-outer-spin-button,.recItem input::-webkit-inner-spin-button{
                 -webkit-appearance:none;margin:0}
  .recItem .rang button{padding:8px 11px;border-radius:99px;font-size:12.5px;
                        border:1px solid var(--bord);background:var(--carte);
                        color:var(--doux);margin-left:auto}

  /* ── Marque « en routine » ───────────────────────────────────────────
     Le 🔁 dit un ÉTAT, le 📌 déclenche une ACTION. Les confondre en un seul
     glyphe — ce que faisait l'app, qui n'affichait que l'épingle — laissait
     deux questions sans réponse : « est-ce que ce plat revient tous les
     jours ? » et « qu'est-ce qui se passe si j'appuie ? ». D'où deux signes
     distincts, et l'épingle qui disparaît une fois le plat en routine : il
     n'y a plus rien à épingler. */
  .routine{font-size:12px;margin-left:6px;vertical-align:1px;
           opacity:.85;cursor:help;font-style:normal}
  /* Le crayon corrige une ligne déjà posée. Même gabarit de frappe que
     l'épingle : c'est un geste du même rang, rare mais pas exceptionnel. */
  .modif{background:none;border:none;color:var(--faible);font-size:14px;
         min-width:40px;min-height:44px;margin:-11px 0;cursor:pointer;opacity:.6}
  .modif:active{opacity:1}

  /* ── Onglet Routine ──────────────────────────────────────────────────
     La gestion des plats récurrents vivait dans une boîte de dialogue ouverte
     depuis la feuille d'ajout : deux niveaux de profondeur pour une liste
     qu'on vient consulter, et aucun endroit pour en AJOUTER un. Un onglet la
     met au même rang que le journal et les tendances — c'est une des trois
     choses que l'app sait faire, pas un réglage. */
  #rtCorps{max-width:780px}
  .rtTete{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  /* Capsule comme tous les autres boutons d'action : `--r-m` en faisait le
     seul coin arrondi « à l'ancienne » d'un écran par ailleurs entièrement
     en capsules. */
  .rtTete .prim{flex:0 0 auto;padding:11px 17px;border-radius:99px;border:none;
                font-size:14px;font-weight:600;margin-left:auto}
  .recItem .rang select{padding:8px 9px;border-radius:var(--r-s);font-size:14px;
                        border:1px solid rgba(255,255,255,.1);background:var(--champ-verre);
                        color:var(--txt)}
  /* La suppression définitive est en dernier et en rouge sourd : elle ne se
     confond pas avec « mettre en pause », qui est le geste courant. */
  .recItem .rang .sup{margin-left:0;color:var(--danger);
                      border-color:var(--danger-bord)}
  .recItem .rang .pause{margin-left:auto}

  /* Fiches : du verre épais, très arrondi. Le rayon monte à 28 px — le
     « continuous corner » d'iOS 26 n'est pas un arrondi de plus, c'est ce qui
     fait qu'une surface a l'air taillée dans un bloc plutôt que découpée aux
     ciseaux. La teinte est plus dense que celle des barres (--verre-fond-FORT)
     parce qu'une fiche porte du texte de saisie : sous 0,8 d'opacité, un
     chiffre en gras se met à vibrer sur ce qui défile derrière. */
  dialog{border-radius:28px;background:var(--verre-fond-fort);color:var(--txt);
         padding:22px;width:min(360px,92vw);
         border:1px solid rgba(255,255,255,.14);
         box-shadow:var(--verre-liseret),0 28px 70px rgba(0,0,0,.62),
                    0 4px 14px rgba(0,0,0,.4);
         animation:monte .34s var(--ressort)}
  /* Le voile s'ALLÈGE (0,62 → 0,42) alors qu'on aurait pu croire l'inverse :
     c'est lui qui donne au verre de la fiche quelque chose à réfracter. Un
     voile presque noir et la fiche redevient une carte grise posée sur du
     noir — tout le travail de matière au-dessus ne se verrait plus. Le flou,
     lui, double : c'est ce qui garde le texte lisible malgré le voile clair. */
  dialog::backdrop{background:rgba(6,7,11,.42);
                   -webkit-backdrop-filter:blur(11px) saturate(130%);
                   backdrop-filter:blur(11px) saturate(130%);
                   animation:voile .3s ease both}
  @keyframes voile{from{opacity:0}}
  @keyframes monte{from{opacity:0;transform:translateY(18px) scale(.94)}}
  /* Respect de « réduire les animations » : une préférence système ignorée est
     un défaut d'accessibilité, pas un détail de style. */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;
                         transition-duration:.01ms !important}
    /* Une animation pilotée par le défilement n'a pas de durée : la ligne
       ci-dessus ne l'atteint pas. Il faut lui retirer sa timeline, sinon la
       tab bar continue de se compacter sous le doigt de quelqu'un qui a
       justement demandé que rien ne bouge. */
    .onglets button span{animation-timeline:none !important;
                         animation-name:none !important}
  }
  #g,#eG{width:100%;padding:15px;font-size:26px;text-align:center;border-radius:var(--r-m);
     border:1px solid rgba(255,255,255,.1);background:var(--champ-verre);margin:14px 0 4px;
     letter-spacing:-.02em;font-weight:600;
     transition:border-color .15s ease,box-shadow .15s ease;outline:none;
     -moz-appearance:textfield;appearance:textfield}
  #g::-webkit-outer-spin-button,#g::-webkit-inner-spin-button,
  #eG::-webkit-outer-spin-button,#eG::-webkit-inner-spin-button{
     -webkit-appearance:none;margin:0}
  /* 16 px minimum : en dessous, iOS zoome à la mise au point et décadre la
     fiche — même contrainte que le formulaire « aliment maison ». */
  #eNom{width:100%;padding:12px;font-size:16px;border-radius:var(--r-s);
        border:1px solid rgba(255,255,255,.1);background:var(--champ-verre);margin:12px 0 2px}
  /* Capsules et non plus rectangles : dans une fiche de verre, un coin droit
     est le seul détail qui trahit un composant dessiné ailleurs. */
  .presets{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0 16px}
  .presets button{padding:11px 0;border-radius:99px;font-size:15px;
                  border:1px solid rgba(255,255,255,.09);
                  background:rgba(255,255,255,.05);color:var(--doux);
                  box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
  .presets button:active{border-color:var(--accent-bord);color:var(--txt);
                         background:var(--accent-sourd)}
  .actions{display:flex;gap:9px}
  .actions button{flex:1;padding:14px;border-radius:99px;border:none;
                  font-size:16px;font-weight:600;letter-spacing:-.01em}
  /* Le bouton principal est le seul aplat d'émeraude plein de l'interface :
     c'est ce qui le rend impossible à confondre avec autre chose. Texte vert
     très sombre plutôt que blanc — sur un aplat clair, le blanc passe sous le
     seuil de contraste alors que l'œil le croit lisible. */
  .prim{background:var(--verre-accent);
        color:var(--sur-accent);
        box-shadow:inset 0 1px 0 rgba(255,255,255,.4),
                   0 4px 16px rgba(16,185,129,.34)}
  /* `--bord` est un blanc à 7,5 % : posé en fond de bouton il ne se voyait
     pas, et « Annuler » ressemblait à du texte flottant. Une surface pleine
     avec un liseré, donc — secondaire ne veut pas dire invisible. Sur du
     verre, cette surface pleine devient elle-même un blanc translucide :
     c'est la seule façon de rester lisible quel que soit ce qui défile
     derrière la fiche. */
  .sec{background:rgba(255,255,255,.09);color:var(--doux);
       box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),
                  inset 0 1px 0 rgba(255,255,255,.16)}
  /* Creux commun à tous les champs. Une ombre INTERNE et non un liseré :
     posée sur du verre, elle donne à la saisie l'air d'être enfoncée dans la
     surface, là où un cadre la ferait flotter par-dessus. */
  #g,#eG,#eNom,#mNom,#dlgM .grille input,#mPoids,.recItem input,
  .recItem .rang select{box-shadow:var(--champ-creux)}
  /* Anneau de focus commun. Seul #q l'avait ; partout ailleurs la mise au
     point ne se voyait pas, ce qui se paie surtout au clavier — on ne sait
     pas dans quel champ on écrit. Le creux est conservé DANS l'anneau :
     sans lui, le champ remonte d'un cran à la mise au point. */
  input:focus,select:focus{outline:none;border-color:var(--accent);
        box-shadow:var(--champ-creux),0 0 0 3px var(--accent-sourd)}
  button:focus-visible,a:focus-visible{outline:2px solid var(--accent);
        outline-offset:2px}
  .apercu{color:var(--doux);font-size:13px;text-align:center;min-height:19px}
  .vide{color:var(--doux);text-align:center;padding:26px 10px;font-size:14px}

  /* ── fiche « aliment maison » ─────────────────────────────────────
     Deux colonnes et pas une : sept champs empilés dépassent la hauteur
     d'écran d'un téléphone, et un formulaire qu'il faut faire défiler pour
     trouver le bouton « Enregistrer » ne se remplit jamais en entier.
     Le sélecteur de mode réutilise .repas (deux colonnes au lieu de quatre). */
  #dlgM{width:min(400px,94vw)}
  #dlgM #mMode{grid-template-columns:repeat(2,1fr)}
  #mNom{width:100%;padding:12px;font-size:16px;border-radius:var(--r-s);
        border:1px solid rgba(255,255,255,.1);background:var(--champ-verre);margin:12px 0 2px}
  #mPoidsLigne{display:block;margin:8px 0 2px}
  .grille{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 10px}
  .grille label:first-child{grid-column:1 / -1}   /* les kcal sur toute la largeur */
  #dlgM label{display:block}
  #dlgM label .meta{display:block;margin-bottom:3px;font-size:11.5px}
  #dlgM .grille input,#mPoids{width:100%;padding:11px;font-size:16px;
        border-radius:var(--r-s);border:1px solid rgba(255,255,255,.1);background:var(--champ-verre);
        -moz-appearance:textfield;appearance:textfield}
  /* 16px minimum sur les champs : en dessous, iOS zoome à la mise au point et
     l'utilisateur se retrouve avec un formulaire décadré. */
  #dlgM input::-webkit-outer-spin-button,#dlgM input::-webkit-inner-spin-button{
        -webkit-appearance:none;margin:0}
  #dlgM .grille label:first-child input{font-size:22px;text-align:center;padding:13px}
  #res .del{background:none;border:none;color:var(--doux);font-size:19px;
            line-height:1;padding:0 2px;margin-left:6px}

  /* ── Respiration intermédiaire ──────────────────────────────────────
     Entre le téléphone et le bureau, seule la gouttière change : 18 px au
     pouce sur un écran de 360 px, ce n'est pas la même chose que 18 px sur
     une tablette de 800 px, où le contenu paraît collé aux bords. Trois
     variables rouvertes, aucune règle de mise en page dupliquée. */
  @media (min-width:600px){
    :root{--pad-x:26px; --pad-y:22px}
  }

  /* ══════════════════════════════════════════════════════════════════
     DESKTOP — additif, à partir de 900 px
     ──────────────────────────────────────────────────────────────────
     Tout le desktop tient dans les media queries ci-dessous, et RIEN
     au-dessus n'a été modifié : la version mobile est validée, elle ne
     doit pas bouger d'un pixel. Toute règle ajoutée ici doit pouvoir
     être supprimée d'un bloc sans rien casser en dessous de 900 px.

     Le pari de fond : sur grand écran on ne manque pas de place, on
     manque de PROXIMITÉ. Étirer les mêmes blocs sur 1900 px éloigne
     chaque chiffre de son voisin sans rien apporter — c'est ce que
     faisait l'app avant : des jauges de 1800 px de long et un solde
     qui disparaissait au premier défilement. On borne donc les
     largeurs, et on dépense l'espace gagné à rendre le résumé
     PERMANENT plutôt qu'à le diluer.
     ══════════════════════════════════════════════════════════════════ */
  @media (min-width:900px){

    /* ── Cadre commun : borné et centré ──────────────────────────── */
    /* Plus rien à redéclarer ici : la colonne (largeur bornée + marges
       automatiques) est portée par la règle de base, et le desktop ne
       fait qu'ouvrir la gouttière. C'est la version mobile qui reste la
       source unique de la mise en page. */
    /* --h-barre : hauteur EXACTE de la barre du haut. Elle est imposée
       plutôt que déduite du contenu, et c'est délibéré : deux éléments
       collants viennent s'aligner dessous (la capsule d'onglets et la
       carte de résumé), et un `top` sticky ne sait pas lire la hauteur
       d'un voisin. Une hauteur devinée ici, c'est un chevauchement au
       premier changement de titre. */
    :root{--pad-x:34px; --pad-y:32px; --h-barre:88px}
    header{height:var(--h-barre);padding-top:0;padding-bottom:0;
           align-content:center}
    h1{font-size:29px;letter-spacing:-.035em}
    header .logo{width:40px;height:40px}
    header .jour{font-size:13px}

    /* ── Capsule d'onglets : elle remonte en haut ────────────────── */
    /* Sur iPad et sur Mac, iOS 26 ne met pas la tab bar en bas : elle
       se pose sous la barre de titre, en capsule, alignée à gauche.
       C'est la bonne lecture ici aussi — à la souris on ne vise pas au
       pouce, et le bas de l'écran est loin du regard. Elle reste
       COLLANTE et en verre : le contenu continue de défiler dessous,
       ce qui est tout l'intérêt.
       Les décalages `left`/`right`/`bottom` du mobile sont explicitement
       remis à `auto` — en `position:sticky` ils ne seraient pas ignorés
       mais interprétés comme des décalages, et la capsule partirait de
       travers. Le `:has()` qui la rétracte pour le bouton d'ajout est
       neutralisé au passage : ici le bouton est ailleurs. */
    .onglets,body:has(#ongJournal.on) .onglets{
             position:sticky;top:calc(var(--h-barre) + 12px);
             left:auto;right:auto;bottom:auto;z-index:45;
             width:max-content;
             margin:0 0 22px max(var(--pad-x),
                     calc(50% - var(--largeur) / 2 + var(--pad-x)))}
    /* Largeur FIXE par segment, et pas `max-content` : la pastille qui
       glisse se déplace d'exactement un tiers de la capsule, ce qui
       suppose trois segments égaux. Avec des largeurs dictées par le
       texte, « Tendances » décalerait la pastille de « Routine ». */
    .onglets button{flex:0 0 148px;flex-direction:row;justify-content:center;
                    gap:8px;padding:9px 0;font-size:14px}
    .onglets button::before{width:18px;height:18px}
    /* Pas de rétrécissement au défilement ici : les libellés d'une barre
       du haut ne gênent personne, et l'espace vertical n'est pas la
       ressource rare sur un écran de bureau. */
    .onglets button span{animation:none;font-size:14px;opacity:1}
    /* Le grand rembourrage du bas servait à dégager la capsule flottante ;
       elle est passée en haut, il ne reste que le bouton d'ajout. */
    main{padding-bottom:96px}

    /* ── Journal : deux colonnes ─────────────────────────────────── */
    /* L'ordre du DOM (résumé, navigation, repas) ne change pas — c'est
       le bon ordre à la lecture d'un lecteur d'écran et au clavier.
       Seul le PLACEMENT change, par zones nommées. La zone « resume »
       couvre les deux rangées : c'est ce qui donne au bloc collant la
       hauteur sur laquelle glisser. */
    /* ⚠️ `:not([hidden])` OBLIGATOIRE. `montre()` bascule les onglets avec
       `.hidden = true`, et le navigateur applique le `display:none`
       correspondant depuis SA feuille de style — donc battu par n'importe
       quelle déclaration de `display` de notre part. Sans ce garde, le
       journal restait affiché SOUS les tendances. C'est le même piège que
       celui documenté plus haut pour `dialog.feuille[open]` ; il coûte une
       seconde à écrire et se voit une capture d'écran plus tard. */
    #vueJournal:not([hidden]){display:grid;align-items:start;column-gap:24px;
                grid-template-columns:minmax(0,1fr) 336px;
                grid-template-areas:"nav resume" "repas resume"}
    /* Le résumé vit dans un WRAPPER (.repasGrp) émis par le mobile, pas à
       nu dans la grille : le placer lui-même en `grid-area:resume` laissait
       son wrapper en `auto`, et l'algorithme le rangeait dans la première
       cellule libre — « nav/resume » est pris par la nav, il tombait donc
       dans « repas/resume » et POUSSAIT la liste des repas 320 px plus bas
       (mesuré le 14/09/2026 : #lignes à 541 px au lieu de 220). On place le
       wrapper, pas la carte. Son intitulé « Bilan du jour » ne se voit qu'en
       colonne unique : en desktop, la grille n'a pas besoin de ce label et
       la carte gagne sa place. */
    #vueJournal > .repasGrp{grid-area:resume}
    #vueJournal > .repasGrp > .repasHaut{display:none}
    /* Le `top` n'est plus 20 px mais la hauteur de la barre du haut plus
       une respiration : la barre est devenue COLLANTE et en verre, et une
       carte qui se fige à 20 px du bord haut irait donc se ranger DERRIÈRE
       elle — le solde, c'est-à-dire la seule chose qu'on vient chercher,
       disparaîtrait au premier défilement sous un verre dépoli. */
    #vueJournal .resume.heros{position:sticky;
                              top:calc(var(--h-barre) + 16px);
                              margin-bottom:0}
    #vueJournal .nav{grid-area:nav;margin:0 0 14px}
    #vueJournal #lignes{grid-area:repas;min-width:0}

    /* Le solde est l'information qu'on vient chercher : à droite il a la
       place de respirer, on lui rend la taille que le mobile lui refusait. */
    .resume.heros .kcal{font-size:29px}
    .resume.heros{padding:18px 18px 16px;gap:13px}

    /* La navigation de jour cesse d'être une barre pleine largeur avec
       deux flèches aux extrémités : à la souris on vise, on n'a pas
       besoin que la cible fasse 700 px de large. */
    #vueJournal .nav{justify-content:flex-start;gap:8px}
    #vueJournal .nav .jour{flex:0 0 auto;text-align:left;margin-left:6px}

    /* ── Tendances : une colonne, centrée ────────────────────────── */
    /* Délibérément PAS une grille de graphes. Chaque conseil est posé
       juste après le graphe qu'il commente (voir le commentaire de
       #vueTend dans le corps) ; en deux colonnes un conseil se
       retrouverait à côté d'un graphe qui n'est pas le sien, et la
       légende deviendrait un contresens. Un graphe étiré sur 1900 px
       est illisible de toute façon : ses points s'écartent, ses
       étiquettes non. */
    /* ── Tendances en deux colonnes ───────────────────────────────
       Le contenu alterne DÉJÀ un bloc puis le conseil qui le commente :
       objectif/conseil, poids/conseil, apport/conseil, protéines/conseil,
       fiabilité/conseil. En colonne unique cette structure en paires est
       perdue — on lit un graphe, puis on descend pour lire ce qu'il raconte,
       et à la hauteur d'un écran de retard on ne les relie plus. Côte à côte,
       chaque paire se lit d'un coup. La grille se contente de suivre l'ordre
       du DOM : rien à réordonner en JS, et si un conseil manque (il n'y en a
       que 3 à 5 par nuit) la paire suivante remonte d'elle-même.

       La colonne de gauche est la plus large — un graphe a besoin d'abscisse,
       un paragraphe de 60 caractères se lit mieux étroit que large.

       Le plafond de 780 px est levé : il bridait le contenu à deux tiers de la
       colonne et laissait la moitié droite d'un 1440 vide. On garde la borne
       commune du <main>, qui aligne Tendances sur la verticale du journal —
       c'était la vraie raison de cette règle, et elle est déjà assurée par
       `main` lui-même. */
    /* ── Routine : une ligne de réglages par plat ─────────────────
       Sur mobile les quatre contrôles (portion, repas, pause, retrait) passent
       à la ligne — `flex-wrap`, sans quoi le dernier sortait de la carte sur
       360 px. Cette règle restait active en desktop : chaque plat y occupait
       **117 px de haut** pour un contenu qui tient sur une ligne, et les
       boutons flottaient au milieu d'un vide de 750 px à cause du
       `margin-left:auto` qui les poussait à droite d'une rangée pleine largeur.

       En grille, l'identité occupe la colonne souple à gauche (nom sur une
       ligne, chiffres dessous) et les contrôles une colonne AUTO à droite. Le
       point qui fait l'ergonomie n'est pas le gain de hauteur mais l'ALIGNEMENT
       VERTICAL : des largeurs fixes sur les quatre contrôles les font tomber
       sur les mêmes verticales d'un plat à l'autre, donc on vise « Retirer »
       sans relire la ligne. Des largeurs dictées par le texte (« Pause » vs
       « Reprendre », « Goûter » vs « Matin ») décaleraient chaque rangée.
       C'est la forme d'une liste de réglages iOS sur grand écran : libellé à
       gauche, valeur et contrôle alignés à droite. */
    #rtCorps{max-width:none}
    .recItem{display:grid;grid-template-columns:minmax(0,1fr) auto;
             grid-template-areas:"nom rang" "meta rang";
             align-items:center;column-gap:22px;padding:11px 16px}
    .recItem > .nom{grid-area:nom}
    .recItem > .meta{grid-area:meta}
    .recItem .rang{grid-area:rang;margin-top:0;flex-wrap:nowrap;
                   justify-content:flex-end}
    /* `auto` poussait le 1er bouton à l'extrémité d'une rangée pleine largeur.
       Dans une colonne dimensionnée par son contenu, il n'a plus lieu d'être. */
    .recItem .rang button{margin-left:0}
    .recItem input{width:66px}
    .recItem .rang select{min-width:106px}
    .recItem .rang .pause{min-width:92px}
    .recItem .rang .sup{min-width:80px}
    /* Le texte d'explication ne doit pas s'étirer sur 1120 px : au-delà d'une
       grosse soixantaine de caractères, l'œil perd le début de la ligne
       suivante. La carte reste large, sa prose non. */
    #rtCorps > .bloc .note{max-width:68ch}

    #tendCorps{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);
               gap:0 22px;align-items:start}

    /* La note de bas de page n'appartient à aucune paire. */
    #tendCorps > .note{grid-column:1 / -1}

    /* ── Feuille d'ajout : fenêtre, plus plein écran ─────────────── */
    /* ⚠️ On ne touche PAS au `display` ici : il reste porté par
       `dialog.feuille[open]`. Une déclaration de `display` sur
       `dialog.feuille` tout court battrait le `display:none` que l'UA
       applique aux dialogues fermés, et la feuille resterait affichée
       en bas de page (le bug du 2026-09-05). */
    /* Hauteur AUTO plafonnée, pas une hauteur fixe : à l'ouverture la
       feuille ne contient que la recherche et les raccourcis, et une
       fenêtre de 720 px pour 400 px de contenu est un grand rectangle
       vide. Elle grandit avec les résultats jusqu'au plafond, où
       `.res` prend le relais et défile.
       ⚠️ `fit-content` et PAS `auto` : le navigateur pose `top:0` ET
       `bottom:0` sur un <dialog> modal, et la règle de positionnement
       absolu veut qu'avec les deux fixés, une hauteur `auto` soit
       résolue pour remplir l'espace — la feuille restait donc collée à
       son plafond de 720 px même vide (mesuré : 406 px de contenu). */
    dialog.feuille{width:min(660px,92vw);max-width:none;
                   height:fit-content;max-height:min(78vh,720px);
                   margin:auto;border:1px solid rgba(255,255,255,.14);
                   border-radius:28px;background:var(--verre-fond-fort);
                   box-shadow:var(--verre-liseret),0 28px 70px rgba(0,0,0,.62),
                              0 4px 14px rgba(0,0,0,.4);
                   animation:monte .34s var(--ressort)}
    /* En fenêtre, la feuille n'a plus d'encoche à dégager : la réserve
       de `env(safe-area-inset-top)` du mobile laisserait un bandeau vide
       en haut sur les portables à écran découpé. */
    .feuilleHaut{padding:16px 18px 12px;border-radius:28px 28px 0 0}
    dialog.feuille .rech{padding:14px 18px 0}
    /* `flex:1` (règle mobile) demandait à la liste de remplir toute la
       hauteur disponible. En plein écran c'est exactement ce qu'on veut ;
       ici le navigateur pose `top:0;bottom:0` sur le <dialog> pour le
       centrer, donc « disponible » = la fenêtre entière, et la feuille
       restait scotchée à son plafond de 720 px même vide. En `0 1 auto`
       elle prend sa hauteur naturelle et ne rétrécit qu'au plafond. */
    dialog.feuille .res{flex:0 1 auto;padding:0 18px 18px}

    /* ── Bouton d'ajout ──────────────────────────────────────────── */
    /* Le rond flottant est une réponse au pouce. À la souris, un bouton
       nommé vaut mieux qu'un pictogramme : on lit avant de cliquer.
       Le libellé est posé en pseudo-éléments pour ne pas toucher au
       HTML — l'`aria-label` du bouton porte déjà le nom accessible. */
    #fab{width:auto;height:52px;border-radius:99px;
         padding:0 22px 0 18px;font-size:0;display:flex;
         align-items:center;justify-content:center;gap:9px;
         right:var(--marge-flot);bottom:30px}
    #fab::before{content:'+';font-size:25px;font-weight:300;line-height:1}
    #fab::after{content:'Ajouter';font-size:14.5px;font-weight:600;
                letter-spacing:-.01em}
  }

  /* ── États de survol ───────────────────────────────────────────────
     L'app ne connaissait que `:active`, c'est-à-dire le doigt. À la
     souris, une interface qui ne réagit qu'au clic paraît morte : on ne
     sait pas ce qui est cliquable avant d'avoir essayé. `hover:hover`
     écarte les tablettes et les écrans tactiles larges, où un survol
     « collant » resterait allumé après le tap.
     ─────────────────────────────────────────────────────────────────── */
  @media (min-width:900px) and (hover:hover){
    /* Sur du verre, un survol ne se dit pas en changeant de gris mais en
       laissant passer un peu plus de lumière : un blanc translucide de
       plus, rien d'autre. */
    .onglets button:not(.on):hover{color:var(--txt);
                                   background:rgba(255,255,255,.08)}
    .nav button:not([disabled]):hover{background:var(--carte-h);
                                      color:var(--txt);border-color:var(--bord-fort)}
    .res li:hover{background:rgba(255,255,255,.11);
                  border-color:var(--bord-fort);cursor:pointer}
    .repas button:not(.on):hover{color:var(--txt);
                                 background:rgba(255,255,255,.07)}
    #fab:hover{filter:brightness(1.06);transform:scale(1.03);
               box-shadow:inset 0 1px 0 rgba(255,255,255,.5),
                          0 12px 32px rgba(16,185,129,.5),
                          0 2px 8px rgba(0,0,0,.45)}
    dialog button:hover{filter:brightness(1.12)}
    .ligne:hover{background:var(--carte-h)}

    /* La croix de suppression ne s'affiche qu'au survol de sa ligne :
       une colonne de croix en permanence transforme un journal en
       formulaire. Elle reste visible au FOCUS clavier — sinon on la
       rendrait inatteignable sans souris, ce qui échangerait un défaut
       d'esthétique contre un défaut d'accessibilité. */
    .ligne .del{opacity:0;transition:opacity .13s var(--sortie)}
    .ligne:hover .del,.ligne .del:focus-visible{opacity:1}
    .ligne .del:hover{color:var(--danger)}
    .ligne .pin,.ligne .modif{opacity:0;transition:opacity .13s var(--sortie)}
    .ligne:hover .pin,.ligne .pin:focus-visible,
    .ligne:hover .modif,.ligne .modif:focus-visible{opacity:.9}
    .ligne .ok:hover{filter:brightness(1.2)}
  }
</style>
</head>
<body>
<!-- Il y avait ici un <span class="jour" id="dateJour"></span>, vestige d'une
     date en sous-titre : RIEN ne l'a jamais rempli (la date vit dans la barre
     de jour du contenu), mais il imposait une 2e rangée à la grille du header.
     Cette rangée vide était tout de même étirée à la moitié de la hauteur, et
     comme le logo et le bouton couvrent les deux rangées alors que le titre
     n'en occupe qu'une, les trois ne se calaient pas au même endroit —
     23 px d'écart mesurés. Invisible à 62 px de haut, criant dès que la barre
     s'est mise à passer de 92 à 54. Supprimé le 13/09/2026. -->
<header><img class="logo" src="static/logo-alpha.png" alt="" width="34" height="34"><h1>Journal</h1><a class="deco" href="#" id="btnDeco">Déconnexion</a></header>
<script>
document.getElementById('btnDeco').addEventListener('click', async e => {
  e.preventDefault();
  // Chemin relatif : fonctionne en local ET derrière le préfixe /nutrition/.
  await fetch('logout');
  location.href = 'login';
});
</script>

<!-- Les libellés sont dans un <span> et non en texte nu : c'est lui que la
     tab bar escamote au défilement (voir `tasseLibelle`), et un nœud de texte
     ne se cible pas en CSS. Les identifiants et la classe `.on` ne bougent
     pas — `montre()` continue de fonctionner à l'identique. -->
<nav class="onglets" aria-label="Sections">
  <button id="ongJournal" class="on"><span>Journal</span></button>
  <button id="ongRoutine"><span>Routine</span></button>
  <button id="ongTend"><span>Tendances</span></button>
</nav>

<main id="vueRoutine" hidden>
  <div id="rtCorps"></div>
</main>

<main id="vueTend" hidden>
  <!-- Les conseils ne sont plus empilés en tête : chacun est posé APRÈS le
       graphe qu'il commente. Quatre encarts d'affilée avant le premier chiffre
       se lisent comme une notice ; intercalés, ils se lisent comme des légendes. -->
  <div id="tendCorps"></div>
</main>

<main id="vueJournal">
  <div class="repasGrp">
  <div class="repasHaut"><span>Bilan du jour</span></div>
  <div class="resume heros">
    <div class="jauges" id="jauges"></div>
    <div class="duo" id="duoJour"></div>
    <div class="solde" id="solde" hidden></div>
    <div class="totalLigne">
      <div><div class="kcal" id="kcal">0 kcal</div>
           <div class="macros" id="estim" style="text-align:left"></div></div>
      <div class="macros" id="macros"></div>
    </div>
  </div>
  </div>

  <div class="nav">
    <button id="prec" title="Jour précédent">‹</button>
    <div class="jour" id="navJour"></div>
    <button id="rafraichir" title="Rafraîchir" aria-label="Rafraîchir">↻</button>
    <button id="suiv" title="Jour suivant">›</button>
  </div>
  <div id="lignes"></div>
</main>


<dialog id="dlg">
  <div class="nom" id="dNom"></div>
  <div class="meta" id="dMeta"></div>
  <div class="avert" id="dAvert"></div>
  <div class="repas" id="repas"></div>
  <input id="g" type="number" inputmode="decimal" step="1" min="1" value="100">
  <div class="apercu" id="apercu"></div>
  <div class="presets">
    <button data-g="30">30</button><button data-g="50">50</button>
    <button data-g="100">100</button><button data-g="150">150</button>
    <button data-g="200">200</button>
  </div>
  <!-- « Proposer chaque jour » : le plat sera pré-posé en grisé à ce repas
       tous les jours, à valider d'un tap. Décoché par défaut — c'est l'exception,
       pas la règle, et une case cochée par erreur fait revenir un plat fantôme. -->
  <label class="recToggle"><input type="checkbox" id="dRec">
    <span>Proposer chaque jour à ce repas (à valider)</span></label>
  <div class="actions">
    <button class="sec" id="annuler">Annuler</button>
    <button class="prim" id="valider">Ajouter</button>
  </div>
</dialog>

<!-- Modification d'une ligne DÉJÀ au journal. Volontairement une fiche à part
     et non la fiche de grammage : celle-ci est le chemin des 20 secondes, elle
     ne doit pas apprendre à faire deux choses. Ici le nom est modifiable, il
     n'y a pas de case « proposer chaque jour », et le bouton n'ajoute rien. -->
<dialog id="dlgEdit">
  <div class="nom" style="margin-bottom:3px">Modifier</div>
  <div class="meta" id="eMeta"></div>
  <input id="eNom" type="text" autocomplete="off" aria-label="Nom du plat">
  <div class="repas" id="eRepas"></div>
  <input id="eG" type="number" inputmode="decimal" step="1" min="1" value="100"
         aria-label="Grammes">
  <div class="apercu" id="eApercu"></div>
  <div class="presets" id="ePresets">
    <button data-g="30">30</button><button data-g="50">50</button>
    <button data-g="100">100</button><button data-g="150">150</button>
    <button data-g="200">200</button>
  </div>
  <div class="actions">
    <button class="sec" id="eAnnuler">Annuler</button>
    <button class="prim" id="eValider">Enregistrer</button>
  </div>
</dialog>

<button id="fab" aria-label="Ajouter un aliment">+</button>

<dialog id="dlgAjout" class="feuille">
  <div class="feuilleHaut">
    <b>Ajouter</b>
    <button id="ajFermer" aria-label="Fermer">✕</button>
  </div>
  <div class="rech">
    <div class="barre">
      <input id="q" type="search" inputmode="search" autocomplete="off"
             placeholder="Aliment ou code-barres…" enterkeyhint="search">
      <button id="scan" title="Scanner un code-barres">📷</button>
      <button id="maison" title="Créer un aliment maison">➕</button>
    </div>
    <!-- `capture` ouvre directement l'appareil photo arrière. C'est un champ
         fichier, pas un flux caméra : ça fonctionne donc en HTTP, contrairement
         à getUserMedia qui exige une origine sécurisée. -->
    <input id="photo" type="file" accept="image/*" capture="environment" hidden>
    <!-- Viseur : vidéo + réticule, montrés et cachés ENSEMBLE par
         directBascule()/directArret() (voir le CSS de #viseur). -->
    <div id="viseur">
      <video id="flux" playsinline muted></video>
      <div class="reticule" aria-hidden="true"><div class="cadre"></div><div class="trait"></div></div>
    </div>
    <div class="etat" id="etat"></div>
    <div class="rapide" id="rapide"></div>
    <div class="pastilles" id="pastilles"></div>
  </div>
  <ul class="res" id="res"></ul>
</dialog>

<dialog id="dlgRep">
  <div class="nom" style="margin-bottom:3px">Reprendre un repas</div>
  <div class="meta" style="margin-bottom:14px">Il sera ajouté à aujourd'hui.</div>
  <div id="repListe" style="max-height:52vh;overflow:auto"></div>
  <div class="actions" style="margin-top:16px">
    <button class="sec" id="repFermer">Fermer</button>
  </div>
</dialog>

<dialog id="dlgProt">
  <div class="nom" style="margin-bottom:3px">Rattraper les protéines</div>
  <div class="meta" id="protReste" style="margin-bottom:14px"></div>
  <div id="protListe" style="max-height:52vh;overflow:auto"></div>
  <div class="actions" style="margin-top:16px">
    <button class="sec" id="protFermer">Fermer</button>
  </div>
</dialog>

<dialog id="dlgM">
  <div class="nom">Aliment maison</div>
  <div class="meta">Pour ce qui n'est ni dans CIQUAL ni sur un code-barres.</div>
  <input id="mNom" type="text" placeholder="Nom du plat" autocomplete="off">

  <!-- Le sélecteur existe parce qu'un emballage donne des valeurs pour 100 g,
       alors qu'un plat qu'on cuisine on en connaît le total. Sans lui, il
       faudrait faire la règle de trois de tête à chaque fois — et c'est
       exactement là qu'on se trompe. La conversion est faite ici, côté
       interface : le serveur ne connaît qu'une convention, pour 100 g. -->
  <div class="repas" id="mMode"></div>
  <label id="mPoidsLigne" style="display:none">
    <span class="meta">Poids total de la portion (g)</span>
    <input id="mPoids" type="number" inputmode="decimal" step="1" min="1" value="156">
  </label>

  <div class="grille">
    <label><span class="meta">kcal</span>
      <input id="m_energie_kcal" type="number" inputmode="decimal" step="0.1" min="0"></label>
    <label><span class="meta">Protéines g</span>
      <input id="m_proteines" type="number" inputmode="decimal" step="0.1" min="0"></label>
    <label><span class="meta">Glucides g</span>
      <input id="m_glucides" type="number" inputmode="decimal" step="0.1" min="0"></label>
    <label><span class="meta">dont sucres g</span>
      <input id="m_sucres" type="number" inputmode="decimal" step="0.1" min="0"></label>
    <label><span class="meta">Lipides g</span>
      <input id="m_lipides" type="number" inputmode="decimal" step="0.1" min="0"></label>
    <label><span class="meta">Fibres g</span>
      <input id="m_fibres" type="number" inputmode="decimal" step="0.1" min="0"></label>
    <label><span class="meta">Sel g</span>
      <input id="m_sel" type="number" inputmode="decimal" step="0.01" min="0"></label>
  </div>
  <div class="apercu" id="mApercu"></div>
  <div class="actions">
    <button class="sec" id="mAnnuler">Annuler</button>
    <button class="prim" id="mValider">Enregistrer</button>
  </div>
</dialog>

<script src="static/zxing.js"></script>
<script>
const $ = s => document.querySelector(s);

// Auth : toute réponse 401 de l'API signifie « session expirée » → retour à la
// page de login. Les chemins sont relatifs, donc ça marche aussi bien derrière
// /nutrition/ qu'en local à la racine.
const _fetch = window.fetch.bind(window);
window.fetch = (...args) => _fetch(...args).then(r => {
  if (r.status === 401) location.href = 'login';
  return r;
});

// Date du jour au format AAAA-MM-JJ dans le fuseau du navigateur.
// ⚠️ Ne JAMAIS repasser par toISOString() ici : il convertit en UTC, donc entre
// minuit et 2h (CEST) il renvoie la VEILLE. Le 2026-09-07 à 00h59, le journal
// titrait « Aujourd'hui · dimanche 6 » et affichait les repas de la veille — et
// comme le serveur, lui, savait qu'on était le 7, il traitait ce jour comme
// passé : lecture du miroir GarminDB au lieu du cache, donc plus de badge
// « en cours ». Un décalage d'affichage qui cassait aussi la dépense du jour.
const isoLocal = (d = new Date()) =>
  `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`
  + `-${String(d.getDate()).padStart(2, '0')}`;
let choix = null, favoris = [], repasChoisi = null;
let jourVu = isoLocal();   // jour actuellement affiché

const REPAS = [['matin','Matin'],['midi','Midi'],['gouter','Goûter'],['soir','Soir']];

// Le 🔁 dit « ce plat revient tous les jours ». Il ne se confond pas avec le
// 📌, qui est le BOUTON pour l'y mettre — un même glyphe pour l'état et pour
// l'action laissait croire qu'appuyer sur l'épingle d'un plat déjà en routine
// ferait quelque chose. Défini une fois : l'icône sert au journal, aux
// propositions en attente et à l'onglet Routine.
const ROUTINE_ICONE = '<span class="routine" role="img" aria-label="en routine"'
  + ' title="Plat en routine : proposé chaque jour à ce repas">🔁</span>';

const nb = v => v == null ? '—' : (Math.round(v * 10) / 10);



// ── Recherche. 250 ms de délai : assez pour ne pas marteler le serveur à chaque
//    lettre, assez court pour que ça reste immédiat au doigt.
let t = null;
$('#q').addEventListener('input', e => {
  clearTimeout(t);
  const q = e.target.value.trim();
  // Les pastilles de favoris disparaissent DÈS qu'une recherche commence.
  // C'est le défaut visible sur la capture de JB : il tapait « Pomme » et les
  // 10 favoris restaient affichés, repoussant « Pomme, sèche » hors de l'écran.
  // Un raccourci qui masque le résultat qu'on cherche n'est plus un raccourci.
  if (q.length < 2) { montreFavoris(); return; }
  $('#pastilles').innerHTML = '';
  t = setTimeout(() => chercher(q), 250);
});

// Les habitudes n'apparaissent qu'au moment de saisir. Le reste du temps
// l'écran appartient au journal du jour : avec 8 aliments enregistrés, la
// liste permanente repoussait le journal hors de l'écran — constaté sur un
// jeu de test le 2026-08-30. L'accueil doit répondre à « qu'ai-je mangé »,
// pas à « que mange-je souvent ».
$('#q').addEventListener('focus', () => {
  if($('#q').value.trim().length < 2) montreFavoris();
});
$('#q').addEventListener('blur', () => {
  // Délai : sans lui, le vidage précède l'enregistrement du clic sur un
  // élément de la liste, et l'appui reste sans effet.
  setTimeout(() => {
    if(document.activeElement !== $('#q') && $('#q').value.trim().length < 2){
      $('#res').innerHTML = ''; $('#pastilles').innerHTML = '';
    }
  }, 180);
});

async function chercher(q){
  try{
    const r = await fetch('api/recherche?q=' + encodeURIComponent(q));
    const d = await r.json();
    affiche(d.resultats, d.message);
  }catch(_){ affiche([], 'Serveur injoignable'); }
}

function affiche(rs, msg){
  const ul = $('#res');
  if(!rs.length){
    ul.innerHTML = `<li class="vide" style="cursor:default">${msg || 'Aucun résultat'}</li>`;
    return;
  }
  ul.innerHTML = rs.map((r,i) => {
    const calc = r.energie_calculee ? '<span class="tag calc">estimée</span>' : '';
    const src  = r.source === 'off' ? '<span class="tag">code-barres</span>'
               : r.source === 'manuel' ? '<span class="tag">maison</span>' : '';
    const mq   = r.marque ? ' · ' + r.marque : '';
    // Un aliment maison est supprimable depuis la liste : c'est le seul moyen de
    // se débarrasser d'un nom mal tapé. Corriger des VALEURS ne demande pas ça —
    // réenregistrer sous le même nom met à jour au lieu de dupliquer.
    const del = r.source === 'manuel'
      ? `<button class="del" data-del="${r.ref}" title="Retirer de mes aliments">×</button>` : '';
    return `<li data-i="${i}"><div class="nom">${esc(r.nom)}${src}${del}</div>
      <div class="meta">${nb(r.energie_kcal)} kcal${calc} · P ${nb(r.proteines)}
      · G ${nb(r.glucides)} · L ${nb(r.lipides)} /100g${esc(mq)}</div></li>`;
  }).join('');
  [...ul.children].forEach(li => li.onclick = () => ouvre(rs[+li.dataset.i]));
  ul.querySelectorAll('[data-del]').forEach(b => b.onclick = async ev => {
    ev.stopPropagation();          // sinon le clic ouvre la fiche de grammage
    const r = rs.find(x => x.ref === b.dataset.del);
    if(!confirm(`Retirer « ${r.nom} » de tes aliments ?\n\n`
              + `Ce qui est déjà au journal n'est pas touché.`)) return;
    await fetch('api/manuel/' + b.dataset.del, {method:'DELETE'});
    chercher($('#q').value.trim());
  });
}

const esc = s => (s||'').replace(/[<>&"]/g, c =>
  ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

// ── Saisie du grammage
function ouvre(r){
  choix = r;
  $('#dNom').textContent = r.nom;
  $('#dMeta').textContent = `${nb(r.energie_kcal)} kcal / 100 g`
    + (r.energie_calculee ? '  (estimée)' : '');
  // Cette fiche exclut un déchet qu'on a en main en pesant (peau, noyau,
  // coquille, arête). Sans ce rappel, peser brut fait une erreur muette et
  // grosse : une banane de 166 g avec la peau = 150 kcal au lieu de ~100.
  const av = $('#dAvert');
  av.classList.toggle('on', !!r.poids_comestible);
  if(r.poids_comestible){
    av.textContent = '⚠️ Poids sans la peau / le noyau / la coquille. '
      + 'Si tu as pesé brut, enlève le déchet du poids (une banane, c\'est '
      + '~⅓ de peau).';
  }
  // Le dernier grammage saisi pour CET aliment plutôt qu'un 100 g universel.
  // JB prend ses galettes de riz par 8 g et jamais par 100 : la valeur par
  // défaut était fausse à chaque fois pour ce qu'il saisit le plus souvent.
  $('#g').value = r.dernier_grammage || 100;
  $('#dRec').checked = false;
  // Même fiche, deux destinations. En mode routine la case « proposer chaque
  // jour » n'a plus de sens (c'est tout ce qu'on est en train de faire) et le
  // bouton doit dire ce qu'il va écrire — « Ajouter » ferait croire à une
  // ligne de journal de plus.
  const versRoutine = modeAjout === 'routine';
  $('#dlg').querySelector('.recToggle').style.display = versRoutine ? 'none' : '';
  $('#valider').textContent = versRoutine ? 'Mettre en routine' : 'Ajouter';
  // Le repas est présélectionné d'après l'heure : dans l'immense majorité des
  // cas il n'y a rien à toucher. C'est une suggestion, pas une contrainte.
  repasChoisi = suggestion;
  dessineRepas();
  majApercu();
  $('#dlg').showModal();
  // Pas de focus automatique : ça ouvre le clavier et masque les préréglages,
  // alors que 100 g convient la plupart du temps. Un geste de moins.
}
function dessineRepas(){
  $('#repas').innerHTML = REPAS.map(([c, l]) =>
    `<button data-r="${c}" class="${c === repasChoisi ? 'on' : ''}">${l}</button>`).join('');
  $('#repas').querySelectorAll('button').forEach(b => b.onclick = () => {
    repasChoisi = b.dataset.r; dessineRepas();
  });
}

$('#g').addEventListener('input', majApercu);
document.querySelectorAll('#dlg .presets button').forEach(b =>
  b.onclick = () => { $('#g').value = b.dataset.g; majApercu(); });

function majApercu(){
  const g = parseFloat($('#g').value) || 0;
  const k = choix?.energie_kcal;
  $('#apercu').textContent = (k == null || !g) ? '' :
    `${Math.round(k * g / 100)} kcal pour ${g} g`;
}

$('#annuler').onclick = () => $('#dlg').close();
$('#valider').onclick = async () => {
  const g = parseFloat($('#g').value);
  if(!(g > 0)) return;
  const btn = $('#valider'); btn.disabled = true;
  const libelle = btn.textContent; btn.textContent = '…';
  try{
    if(modeAjout === 'routine'){
      // Création depuis une FICHE et non depuis une ligne du journal : le
      // serveur attend donc des valeurs pour 100 g, ce que la recherche rend
      // déjà. Rien n'est écrit au journal — mettre en routine n'est pas manger.
      const rep = await fetch('api/recurrents', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({...choix, grammes: g, repas: repasChoisi})});
      const dr = await rep.json();
      if(!rep.ok) throw new Error(dr.detail || 'refusé par le serveur');
      $('#dlg').close(); fermeAjout();
      montre('routine');
      if(dr.reactive) alert(`« ${choix.nom} » était déjà en routine à ce repas.\n`
                          + `Sa portion a été mise à jour au lieu d'être dupliquée.`);
      return;
    }
    const r = await fetch('api/journal', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({...choix, grammes: g, repas: repasChoisi})});
    if(!r.ok) throw new Error(await r.text());
    // Récurrent créé DEPUIS la ligne qui vient d'être écrite (journal_id) et
    // non depuis la fiche : le serveur marque alors aujourd'hui comme validé,
    // sinon le plat tout juste ajouté réapparaîtrait en grisé dans la seconde.
    if($('#dRec').checked){
      const {id} = await r.json();
      if(id) await fetch('api/recurrents', {method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({journal_id: id, repas: repasChoisi})});
    }
    $('#dlg').close();
    $('#q').value = ''; $('#res').innerHTML = ''; etat('');
    jourVu = isoLocal();
    await chargeJour();
  }catch(e){ alert('Échec de l’enregistrement : ' + e.message); }
  // On restaure le libellé CAPTURÉ et non « Ajouter » en dur : après un échec
  // en mode routine, le bouton mentirait sur ce qu'il fait.
  finally{ btn.disabled = false; btn.textContent = libelle; }
};

// Une jauge = libellé, piste, valeur. La barre sature visuellement à 100 % mais
// le CHIFFRE, lui, continue de monter : dépasser sa cible doit se lire, pas se
// faire écrêter en silence. Le seuil « trop » est à +5 % et pas à +0 %, sinon la
// jauge passe en alerte pour 3 kcal d'arrondi.
function jauge(lib, v, cible, unite){
  v = v || 0;
  const pct = Math.min(100, cible ? v / cible * 100 : 0);
  const cls = v > cible * 1.05 ? 'trop' : (v >= cible * 0.95 ? 'atteint' : '');
  return `<div class="jauge"><span class="lib">${lib}</span>`
       + `<span class="piste"><span class="barre ${cls}" style="width:${pct.toFixed(1)}%"></span></span>`
       + `<span class="val">${Math.round(v)} / ${cible} ${unite}</span></div>`;
}

// ── Journal d'une journée, regroupé par repas
let suggestion = 'midi', bornes = {};

const AUJOURDHUI = () => isoLocal();

function libelleJour(iso){
  const d = new Date(iso + 'T12:00:00');
  const j = AUJOURDHUI();
  if(iso === j) return {titre:"Aujourd'hui", sous:d.toLocaleDateString('fr-FR',
    {weekday:'long', day:'numeric', month:'long'})};
  const hier = isoLocal(new Date(Date.now() - 864e5));
  return {titre: iso === hier ? 'Hier'
            : d.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'}),
          sous: iso === hier ? d.toLocaleDateString('fr-FR',
            {weekday:'long', day:'numeric', month:'long'}) : ''};
}

async function chargeJour(){
  const d = await (await fetch('api/jour?d=' + jourVu)).json();
  suggestion = d.repas_suggere || suggestion;
  bornes = {premier: d.premier_jour, dernier: d.dernier_jour};

  const lj = libelleJour(d.jour);
  $('#navJour').innerHTML = `${lj.titre}${lj.sous ? `<small>${lj.sous}</small>` : ''}`;
  // On ne propose pas de remonter avant la première saisie : il n'y a rien
  // derrière. Vers l'avant en revanche, la borne est AUJOURD'HUI et surtout
  // PAS `bornes.dernier` (= MAX(jour) du journal, donc la dernière saisie).
  // Tant que rien n'est enregistré le jour même, ces deux dates diffèrent et
  // borner sur la saisie enferme sur hier : on recule d'un jour et la flèche
  // du retour est grisée. Un jour vide reste visitable — c'est justement
  // celui où on va saisir.
  $('#prec').disabled = !bornes.premier || jourVu <= bornes.premier;
  $('#suiv').disabled = jourVu >= AUJOURDHUI();

  // ── Jauges d'objectif ──
  // Rien n'est affiché si l'API ne renvoie pas d'objectifs : une jauge sur une
  // cible inventée est pire que pas de jauge, parce qu'elle a l'air de mesurer
  // quelque chose. `objectifs` vaut null quand config/nutrition-profil.json est
  // absent ou incomplet.
  $('#jauges').innerHTML = d.objectifs
    ? jauge('Calories', d.total.energie_kcal, d.objectifs.kcal, 'kcal')
      + jauge('Protéines', d.total.proteines, d.objectifs.proteines, 'g')
    : '';

  // ── Solde du jour : ce qu'on a mangé moins ce que Garmin dit qu'on a brûlé ──
  // Masqué si la dépense est inconnue. Et le jour COURANT est signalé « en
  // cours » : Garmin n'a pas fini de consolider, son « repos » monte encore
  // jusqu'à J+3 (mesuré le 2026-09-05). Afficher ce chiffre sans le dire
  // laisserait croire à un déficit plus petit qu'il ne sera.
  const dep = d.depense;
  if(dep && dep.total){
    const solde = d.total.energie_kcal - dep.total;
    const kg = Math.abs(solde) * 7 / 7700;
    $('#solde').hidden = false;
    $('#solde').innerHTML =
      `<span class="quoi">Solde du jour</span>`
      + (dep.en_cours ? `<span><i>dépense en cours</i></span>` : '<span></span>');
    // Le solde devient le chiffre principal. « Mangé » et « Dépensé » sont déjà
    // écrits juste au-dessus dans les deux colonnes : les répéter en gros
    // remplissait la carte sans rien ajouter, exactement ce que JB a reproché
    // à l'ancienne disposition.
    $('#kcal').innerHTML = `<span class="${solde < 0 ? 'deficit' : 'exces'}">`
      + `${solde > 0 ? '+' : '−'}${Math.abs(Math.round(solde))}</span>`
      + `<span style="font-size:15px;font-weight:500;color:var(--doux)"> kcal</span>`;
    $('#estim').textContent = `${kg.toFixed(2)} kg/semaine à ce rythme`;
  } else {
    $('#solde').hidden = true;
    $('#kcal').textContent = Math.round(d.total.energie_kcal) + ' kcal';
    $('#estim').textContent = d.kcal_estimees
      ? `dont ${Math.round(d.kcal_estimees)} estimées` : '';
  }

  // Le manque de protéines pilote l'action rapide : le bouton n'apparaît que
  // s'il y a quelque chose à rattraper, et il porte le chiffre.
  resteProt = (d.objectifs && jourVu === AUJOURDHUI())
    ? Math.max(0, d.objectifs.proteines - (d.total.proteines || 0)) : 0;
  dessineRapide();

  $('#macros').innerHTML =
    `P ${nb(d.total.proteines)} g · L ${nb(d.total.lipides)} g<br>`
    + `G ${nb(d.total.glucides)} g · F ${nb(d.total.fibres)} g`;

  // Mangé / dépensé en deux colonnes, comme prévu/mesuré dans Tendances : le
  // solde est une SOUSTRACTION, la donner sans ses deux termes oblige à faire
  // confiance au résultat sans pouvoir le vérifier d'un coup d'œil.
  const dd = d.depense;
  $('#duoJour').innerHTML = dd && dd.total
    ? `<div><div class="quoi">Mangé</div>`
      + `<div class="val">${Math.round(d.total.energie_kcal)}<span style="font-size:12px;font-weight:400"> kcal</span></div>`
      + `<div class="det">${d.groupes.filter(g => g.lignes.length).length} repas · P ${nb(d.total.proteines)} g</div></div>`
      + `<div><div class="quoi">Dépensé</div>`
      + `<div class="val">${Math.round(dd.total)}<span style="font-size:12px;font-weight:400"> kcal</span></div>`
      + `<div class="det" style="font-size:11px;color:var(--faible)">`
      + `repos ${nb(dd.repos)} · actif ${nb(dd.actif)}<br>`
      + `${dd.pas ? dd.pas.toLocaleString('fr-FR') + ' pas' : '—'}`
      + (dd.en_cours ? ' · <i>en cours</i>' : '') + `</div></div>`
    : '';

  // Une carte PAR REPAS, les aliments dedans séparés par des filets — au lieu
  // d'une carte flottante par aliment. Un dîner de 4 lignes faisait 4 objets
  // visuellement identiques et sans lien entre eux ; la hiérarchie repas →
  // aliments n'existait que dans l'espacement. Moins d'objets, plus de sens.
  $('#lignes').innerHTML = d.groupes.length
    ? d.groupes.map(g => `
        <div class="repasGrp">
          <div class="repasHaut"><span>${g.libelle}</span>
            <span class="kc">${Math.round(g.kcal)} kcal · P ${g.proteines} g</span></div>
          <div class="repasCarte">
          ${g.lignes.map(l => `
            <div class="ligne">
              <div><b>${esc(l.nom)}</b>${l.routine ? ROUTINE_ICONE : ''}
                <div class="meta">${l.grammes} g · ${Math.round(l.energie_kcal||0)} kcal
                · ${l.horodatage.slice(11,16)}</div></div>
              <div class="act">
                <button class="modif" data-edit="${l.id}"
                        title="Modifier la portion, le repas ou le nom"
                        aria-label="Modifier">✎</button>
                ${l.routine ? '' : `<button class="pin" data-pin="${l.id}"
                        title="Proposer chaque jour à ce repas"
                        aria-label="Mettre en routine">📌</button>`}
                <button class="del" data-id="${l.id}" aria-label="Supprimer">×</button>
              </div>
            </div>`).join('')}
          ${(g.en_attente || []).map(p => `
            <div class="ligne attente">
              <div><b>${esc(p.nom)}</b>${ROUTINE_ICONE}<span class="tag att">en attente</span>
                <div class="meta">${p.grammes} g · ${Math.round(p.energie_kcal||0)} kcal
                · non compté</div></div>
              <div class="act">
                <button class="ok" data-val="${p.recurrent_id}">Valider</button>
                <button class="del" data-rej="${p.recurrent_id}" data-nom="${esc(p.nom)}"
                        aria-label="Pas ce jour-là">×</button>
              </div>
            </div>`).join('')}
          </div>
        </div>`).join('')
    : `<div class="vide">${d.jour === AUJOURDHUI()
         ? 'Rien enregistré aujourd’hui' : 'Rien ce jour-là'}</div>`;

  $('#lignes').querySelectorAll('.del').forEach(b => b.onclick = async () => {
    // On capture la ligne AVANT de la supprimer : après le DELETE elle n'existe
    // plus nulle part, et sans cette copie « Annuler » n'aurait rien à rejouer.
    const ligne = d.lignes.find(x => String(x.id) === b.dataset.id);
    await fetch('api/journal/' + b.dataset.id, {method:'DELETE'});
    chargeJour();
    if(ligne) proposeAnnulation(ligne);
  });

  // Le crayon rouvre la ligne pour la corriger. On repasse par `d.lignes` (la
  // liste complète) et non par le groupe : c'est elle qui porte `repas`, dont
  // la fiche a besoin pour présélectionner le bon bouton.
  $('#lignes').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
    const l = d.lignes.find(x => String(x.id) === b.dataset.edit);
    if(l) ouvreEdition(l);
  });

  // ── Récurrents : valider / écarter une proposition, épingler une ligne ──
  // La décision porte sur le jour AFFICHÉ, pas sur aujourd'hui : on peut
  // valider après coup le déjeuner d'hier qu'on a oublié de confirmer.
  $('#lignes').querySelectorAll('[data-val]').forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = '…';
    await fetch(`api/recurrents/${b.dataset.val}/valider`, {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({jour: jourVu})});
    chargeJour();
  });
  $('#lignes').querySelectorAll('[data-rej]').forEach(b => b.onclick = async () => {
    const rid = b.dataset.rej, jour = jourVu;
    await fetch(`api/recurrents/${rid}/rejeter`, {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({jour})});
    chargeJour();
    // Même bandeau que la suppression d'une ligne : un « × » raté ne doit pas
    // coûter plus cher ici qu'ailleurs. Annuler efface le rejet, la proposition
    // revient en grisé.
    proposeAnnulation({nom: b.dataset.nom, _rec: {rid, jour}}, 'écarté');
  });
  $('#lignes').querySelectorAll('[data-pin]').forEach(b => b.onclick = async () => {
    const l = d.lignes.find(x => String(x.id) === b.dataset.pin);
    if(!l) return;
    const lib = (REPAS.find(([c]) => c === l.repas) || [, l.repas])[1];
    if(!confirm(`Mettre « ${l.nom} » (${l.grammes} g) en routine au repas ${lib} ?\n\n`
              + `Il sera proposé chaque jour en grisé, à valider d'un tap, et marqué 🔁.\n`
              + `Ce jour-ci est déjà compté.`)) return;
    const r = await fetch('api/recurrents', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({journal_id: l.id})});
    if(!r.ok) alert('Échec : ' + await r.text());
    chargeJour();
  });
}

// ── Annulation d'une suppression ──────────────────────────────────────────
//
// Il n'y avait AUCUN retour en arrière : un « × » raté et la ligne était perdue,
// il fallait tout ressaisir. Sur un bouton que je venais justement d'agrandir
// parce qu'il se ratait au pouce — agrandir la cible réduit la fréquence de
// l'erreur, ça n'en réduit pas le coût.
//
// Six secondes : assez pour voir le total bouger et comprendre qu'on s'est
// trompé, assez court pour ne pas rester en travers de l'écran.
let minuteurAnnul = null;
function proposeAnnulation(ligne, verbe = 'supprimé'){
  clearTimeout(minuteurAnnul);
  document.querySelector('.annul')?.remove();
  const el = document.createElement('div');
  el.className = 'annul';
  // L'aplomb n'est plus écrit ici mais dans la règle `.annul`, à partir des
  // mêmes jetons que la capsule d'onglets et le bouton d'ajout. Deux styles en
  // ligne posés à la main (`bottom:20px`, `right:92px`) désignaient une barre
  // du bas qui n'existe plus, et le bandeau serait venu se poser SUR la
  // capsule : une hauteur devinée ici ne peut pas suivre celle de là-bas.
  el.innerHTML =`<span>« ${esc(ligne.nom.slice(0, 26))} » ${verbe}</span>`
               + `<button>Annuler</button>`;
  el.querySelector('button').onclick = async () => {
    clearTimeout(minuteurAnnul); el.remove();
    // Rejet d'un récurrent : on efface la décision du jour, rien à restaurer.
    if(ligne._rec){
      await fetch(`api/recurrents/${ligne._rec.rid}/jour/${ligne._rec.jour}`, {method:'DELETE'});
      chargeJour(); return;
    }
    // Endpoint DÉDIÉ, pas POST /api/journal : celui-ci attend des valeurs pour
    // 100 g et force la date du jour. Y renvoyer une ligne de journal telle
    // quelle multiplierait les valeurs par le grammage ET recréerait l'aliment
    // au mauvais jour si la suppression portait sur une journée passée.
    await fetch('api/journal/restaurer', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify(ligne)});
    chargeJour();
  };
  document.body.appendChild(el);
  minuteurAnnul = setTimeout(() => el.remove(), 6000);
}

// Réserve sous le contenu = hauteur réelle de la barre + une marge de respiration.
// Mesurée après peinture : la barre grandit quand la ligne de solde apparaît.

// ── Feuille d'ajout ───────────────────────────────────────────────────────
//
// La recherche vivait en haut de l'écran principal, en permanence. Elle ne sert
// pourtant qu'au moment d'ajouter — le reste du temps elle prenait un tiers de
// la hauteur pour ne rien dire. Elle est maintenant derrière un seul bouton.
// Une SEULE feuille de recherche, deux destinations : le journal, ou la
// routine. Dupliquer la recherche dans l'onglet Routine aurait voulu dire deux
// barres, deux scanners, deux listes de favoris à tenir à jour — pour la même
// question, « quel aliment ? ». Le mode ne survit jamais à la fermeture : une
// feuille rouverte repart toujours sur le journal, sinon un « + » tapé la
// veille dans l'onglet Routine écrirait au mauvais endroit le lendemain.
let modeAjout = 'journal';

function ouvreAjout(mode = 'journal'){
  modeAjout = mode;
  $('#dlgAjout').showModal();
  montreFavoris();
  // Pas de focus automatique sur le champ : il ouvrirait le clavier et
  // masquerait aussitôt les favoris et « repas passé », qui sont justement les
  // deux chemins les plus courts. Même raisonnement que la fiche de grammage.
}
function fermeAjout(){
  $('#dlgAjout').close();
  $('#q').value = ''; $('#res').innerHTML = ''; $('#pastilles').innerHTML = '';
  $('#etat').textContent = '';
}
$('#fab').onclick = () => ouvreAjout();
$('#ajFermer').onclick = fermeAjout;
// Le bouton « retour » d'Android ferme la feuille au lieu de quitter la page.
$('#dlgAjout').addEventListener('close', () => {
  $('#q').value = ''; $('#res').innerHTML = ''; $('#pastilles').innerHTML = '';
  modeAjout = 'journal';
});

// ── Actions rapides : répéter un repas, rattraper les protéines ───────────
//
// Ces deux boutons existent parce que le parcours « chercher un aliment » ne
// couvrait AUCUN des deux besoins réels observés : « j'ai mangé pareil qu'hier »
// (demandé deux fois en une semaine, traité à la main les deux fois) et « il me
// manque 139 g de protéines, je mange quoi ». Chercher par nom ne répond ni à
// l'un ni à l'autre.
let resteProt = 0;

function dessineRapide(){
  $('#rapide').innerHTML =
      `<button id="bRep">↻ Repas passé</button>`
    + (resteProt > 0
        ? `<button id="bProt" class="fort">🥩 Protéines −${Math.round(resteProt)} g</button>`
        : '')
    + `<button id="bRec">🔁 Routine</button>`;
  $('#bRep').onclick = ouvreRepetition;
  const bp = $('#bProt'); if(bp) bp.onclick = ouvreProteines;
  // La gestion des plats en routine a son onglet : ce raccourci y mène au lieu
  // d'ouvrir une boîte qui dirait la même chose en moins large.
  $('#bRec').onclick = () => { fermeAjout(); montre('routine'); };
}

// ── Onglet Routine : les plats qui reviennent ─────────────────────────────
//
// Cette gestion vivait dans une boîte ouverte depuis la feuille d'ajout : deux
// niveaux de profondeur pour une liste qu'on vient consulter, et AUCUN endroit
// pour en ajouter un — il fallait d'abord manger le plat, puis l'épingler
// depuis le journal. Un onglet la met au même rang que le journal et les
// tendances : c'est une des trois choses que l'app sait faire.
//
// Pause et suppression sont deux boutons distincts, et c'est délibéré :
// « pas cette semaine » et « plus jamais » ne coûtent pas la même chose. La
// pause garde le plat et l'historique de ses décisions ; le retrait efface
// les deux, sans jamais toucher aux lignes de journal déjà enregistrées.
async function chargeRoutine(){
  const d = await (await fetch('api/recurrents?tous=true')).json();
  const lib = c => (REPAS.find(([k]) => k === c) || [, c])[1];
  const stat = {en_attente: 'en attente', valide: 'validé aujourd’hui',
                rejete: 'écarté aujourd’hui'};
  const actifs = d.recurrents.filter(r => r.actif).length;

  $('#rtCorps').innerHTML = `
    <div class="bloc">
      <div class="rtTete">
        <div>
          <div class="nom">🔁 Plats en routine</div>
          <div class="meta">${d.recurrents.length
            ? `${actifs} actif${actifs > 1 ? 's' : ''} sur ${d.recurrents.length}`
            : 'aucun pour l’instant'}</div>
        </div>
        <button class="prim" id="rtAjouter">+ Ajouter</button>
      </div>
      <div class="note">Proposés chaque jour en grisé dans le journal, et comptés
        seulement une fois validés d'un tap. La portion réglée ici vaut pour les
        jours à venir — les repas déjà enregistrés ne bougent pas.</div>
    </div>
    ${d.recurrents.length ? `<div class="repasHaut"><span>Plats enregistrés</span>`
      + `<span class="kc">${actifs} sur ${d.recurrents.length} actifs</span></div>`
      + `<ul class="recListe">`
      + d.recurrents.map(r => `
      <li class="recItem ${r.actif ? '' : 'off'}" data-id="${r.id}">
        <div class="nom">${esc(r.nom)}${ROUTINE_ICONE}
          <span class="tag">${lib(r.repas)}</span>
          ${r.actif && r.statut_jour
            ? `<span class="tag ${r.statut_jour === 'en_attente' ? 'att' : ''}">${stat[r.statut_jour]}</span>`
            : ''}
          ${r.actif ? '' : '<span class="tag">en pause</span>'}</div>
        <div class="meta">${Math.round(r.portion.energie_kcal)} kcal · P ${nb(r.portion.proteines)} g
          pour ${r.grammes} g</div>
        <div class="rang">
          <input type="number" inputmode="decimal" min="1" step="1" value="${r.grammes}"
                 data-g="${r.id}" aria-label="Grammes"><span class="meta" style="margin:0">g</span>
          <select data-repas="${r.id}" aria-label="Repas">${REPAS.map(([c, l]) =>
            `<option value="${c}"${c === r.repas ? ' selected' : ''}>${l}</option>`).join('')}</select>
          <button class="pause" data-tog="${r.id}" data-on="${r.actif}"
                  title="${r.actif ? 'Suspendre les propositions, sans rien perdre'
                                   : 'Reprendre les propositions quotidiennes'}">${
            r.actif ? 'Pause' : 'Reprendre'}</button>
          <button class="sup" data-sup="${r.id}" data-nom="${esc(r.nom)}">Retirer</button>
        </div>
      </li>`).join('') + `</ul>`
    : `<div class="vide">Aucun plat en routine.<br><br>« + Ajouter » ci-dessus,
       le 📌 d'une ligne du journal, ou la case « Proposer chaque jour » de la
       fiche d’ajout.</div>`}`;

  $('#rtAjouter').onclick = () => ouvreAjout('routine');

  $('#rtCorps').querySelectorAll('[data-g]').forEach(i => i.onchange = async () => {
    const g = parseFloat(i.value);
    // Un champ vidé ou négatif reprend sa valeur d'avant plutôt que de partir
    // au serveur : la fiche n'a rien à refuser, il n'y a rien à corriger.
    if(!(g > 0)){ i.value = d.recurrents.find(r => r.id === +i.dataset.g).grammes; return; }
    await fetch('api/recurrents/' + i.dataset.g, {method:'PATCH',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({grammes: g})});
    chargeRoutine(); chargeJour();
  });

  $('#rtCorps').querySelectorAll('[data-repas]').forEach(sel => sel.onchange = async () => {
    await fetch('api/recurrents/' + sel.dataset.repas, {method:'PATCH',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({repas: sel.value})});
    chargeRoutine(); chargeJour();
  });

  $('#rtCorps').querySelectorAll('[data-tog]').forEach(b => b.onclick = async () => {
    await fetch('api/recurrents/' + b.dataset.tog, {method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({actif: b.dataset.on !== '1'})});
    chargeRoutine(); chargeJour();
  });

  $('#rtCorps').querySelectorAll('[data-sup]').forEach(b => b.onclick = async () => {
    // Endpoint DÉDIÉ : `DELETE /api/recurrents/{id}` tout court ne fait que
    // mettre en pause, et l'appeler ici aurait laissé le plat dans la liste
    // sous un bouton qui promettait de le retirer.
    if(!confirm(`Retirer « ${b.dataset.nom} » de la routine ?\n\n`
              + `Il ne sera plus proposé. Les repas déjà enregistrés au journal `
              + `ne sont pas touchés.\n\nPour une pause temporaire, préfère `
              + `« Mettre en pause ».`)) return;
    const r = await fetch('api/recurrents/' + b.dataset.sup + '/definitif',
                          {method:'DELETE'});
    if(!r.ok){ alert('Échec du retrait.'); return; }
    chargeRoutine(); chargeJour();
  });
}

// ── Modifier une ligne déjà enregistrée ───────────────────────────────────
//
// Jusqu'ici, corriger une portion voulait dire supprimer la ligne et tout
// ressaisir, recherche et scan compris. C'est ce parcours-là qu'on remplace,
// pas une deuxième façon d'ajouter.
//
// Le serveur recalcule les valeurs à partir de la ligne elle-même : l'aperçu
// n'a donc qu'à refaire la même règle de trois pour montrer ce qui sera écrit.
let edition = null;      // {id, kcal100, repas}

function ouvreEdition(l){
  const g0 = l.grammes || 0;
  // `depart` garde l'état d'origine : on n'enverra QUE ce qui a bougé. Sans ça,
  // rouvrir une vieille ligne pour corriger 10 g renverrait aussi son repas —
  // et le journal porte des repas d'avant les quatre actuels (« apres-midi »,
  // vu en base) que le serveur refuse à juste titre. La correction de la
  // portion échouerait pour une valeur qu'on n'a pas touchée.
  edition = {id: l.id, repas: l.repas,
             kcal100: g0 > 0 ? (l.energie_kcal || 0) * 100 / g0 : null,
             depart: {nom: l.nom, grammes: g0, repas: l.repas}};
  $('#eNom').value = l.nom;
  const inconnu = !REPAS.some(([c]) => c === l.repas);
  $('#eMeta').textContent = (edition.kcal100 == null ? '' :
      `${Math.round(edition.kcal100)} kcal / 100 g`)
    + (l.horodatage ? ` · saisi à ${l.horodatage.slice(11, 16)}` : '')
    + (inconnu ? ` · repas « ${l.repas} »` : '');
  $('#eG').value = Math.round((l.grammes || 0) * 10) / 10;
  dessineERepas();
  majEApercu();
  $('#dlgEdit').showModal();
  // showModal() pose le focus sur le premier champ — ici le nom, donc le
  // clavier s'ouvrirait sur téléphone alors que la correction porte neuf fois
  // sur dix sur la portion. Même garde que l'ancienne fiche des récurrents.
  document.activeElement?.blur();
}

function dessineERepas(){
  $('#eRepas').innerHTML = REPAS.map(([c, l]) =>
    `<button data-r="${c}" class="${c === edition.repas ? 'on' : ''}">${l}</button>`).join('');
  $('#eRepas').querySelectorAll('button').forEach(b => b.onclick = () => {
    edition.repas = b.dataset.r; dessineERepas();
  });
}

function majEApercu(){
  const g = parseFloat($('#eG').value) || 0;
  $('#eApercu').textContent = (!edition || edition.kcal100 == null || !g) ? ''
    : `${Math.round(edition.kcal100 * g / 100)} kcal pour ${g} g`;
}

$('#eG').addEventListener('input', majEApercu);
$('#ePresets').querySelectorAll('button').forEach(b =>
  b.onclick = () => { $('#eG').value = b.dataset.g; majEApercu(); });
$('#eAnnuler').onclick = () => $('#dlgEdit').close();

$('#eValider').onclick = async () => {
  const g = parseFloat($('#eG').value), nom = $('#eNom').value.trim();
  if(!(g > 0)){ $('#eApercu').textContent = 'Portion invalide.'; return; }
  if(nom.length < 2){ $('#eApercu').textContent = 'Il manque le nom.'; return; }
  // Seuls les champs modifiés partent. Le serveur refuse un corps vide, ce qui
  // ferait une erreur rouge sur une fiche qu'on a juste ouverte puis validée
  // sans rien changer : on ferme, c'est la réponse honnête.
  const maj = {};
  if(g !== edition.depart.grammes) maj.grammes = g;
  if(nom !== edition.depart.nom) maj.nom = nom;
  if(edition.repas !== edition.depart.repas) maj.repas = edition.repas;
  if(!Object.keys(maj).length){ $('#dlgEdit').close(); return; }

  const btn = $('#eValider'); btn.disabled = true; btn.textContent = '…';
  try{
    const r = await fetch('api/journal/' + edition.id, {
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(maj)});
    if(!r.ok){
      const d = await r.json().catch(() => ({}));
      throw new Error(d.detail || 'refusé par le serveur');
    }
    $('#dlgEdit').close();
    await chargeJour();
  }catch(e){ $('#eApercu').textContent = 'Échec : ' + e.message; }
  finally{ btn.disabled = false; btn.textContent = 'Enregistrer'; }
};

async function ouvreRepetition(){
  const d = await (await fetch('api/repas-recents?limite=10')).json();
  $('#repListe').innerHTML = d.repas.length ? d.repas.map((r, i) => `
    <li data-r="${i}" style="list-style:none;background:var(--surface);
        border:1px solid var(--bord);border-radius:var(--r-m);padding:12px 13px;
        margin-bottom:7px;cursor:pointer">
      <div class="nom">${esc(r.libelle)} · ${r.jour.slice(8)}/${r.jour.slice(5,7)}
        <span class="tag">${r.n} aliment${r.n > 1 ? 's' : ''}</span></div>
      <div class="meta">${Math.round(r.kcal)} kcal · P ${r.proteines} g</div>
      <div class="meta">${esc(r.apercu)}</div>
    </li>`).join('')
    : `<div class="vide">Aucun repas passé à reprendre.</div>`;
  $('#repListe').querySelectorAll('[data-r]').forEach(li => li.onclick = async () => {
    const r = d.repas[+li.dataset.r];
    li.style.opacity = .5;
    const res = await fetch('api/repeter', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({jour: r.jour, repas: r.repas, vers_repas: suggestion})});
    if(res.ok){ $('#dlgRep').close(); fermeAjout(); chargeJour(); }
    else { li.style.opacity = 1; alert('Échec de la reprise du repas.'); }
  });
  $('#dlgRep').showModal();
}
