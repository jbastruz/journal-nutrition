// ── Onglet Tendances ──────────────────────────────────────────────────────
// Graphe en barres, SVG écrit à la main. Trois couleurs qui veulent dire
// quelque chose : atteint, sous la cible, et saisie douteuse — cette dernière
// existe parce qu'une journée à 313 kcal n'est PAS une journée à jeun, et une
// barre au ras du sol sans distinction raconterait le contraire.
function graphe(serie, champ, cible, unite){
  const n = serie.length, L = 320, H = 118, hautG = 10, bas = H - 20;
  const vals = serie.map(x => x[champ] || 0);
  const max = Math.max(cible || 0, ...vals) * 1.12 || 1;
  const larg = L / n, ep = Math.max(4, larg * 0.56), r = Math.min(3, ep / 2);
  const y = v => bas - (v / max) * (bas - hautG);

  // Lignes de repère à 0, 50 et 100 % de la cible. Sans elles, une barre n'a
  // pas d'échelle : on voit qu'elle est plus haute qu'une autre, pas de combien.
  const reperes = cible ? [0.5, 1].map(k => {
    const yy = y(cible * k);
    return `<line x1="0" x2="${L}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" `
         + `class="${k === 1 ? 'cible' : 'grille'}"/>`
         + (k === 1 ? `<text x="${L - 2}" y="${(yy - 3).toFixed(1)}" text-anchor="end" `
                    + `class="etiqCible">${cible} ${unite}</text>` : '');
  }).join('') : '';

  const barres = serie.map((x, i) => {
    const v = x[champ] || 0;
    const cx = i * larg + (larg - ep) / 2;
    const cls = !x.entrees ? 'vide'
              : x.en_cours ? 'encours'
              : !x.complet ? 'doute'
              : (cible && v >= cible * 0.95) ? 'atteint' : 'sous';
    const h = Math.max(v ? 1.5 : 0, bas - y(v));
    const barre = `<rect class="b ${cls}" x="${cx.toFixed(1)}" y="${(bas - h).toFixed(1)}" `
                + `width="${ep.toFixed(1)}" height="${h.toFixed(1)}" rx="${r}"/>`;
    // Valeur écrite au-dessus des seules barres qui portent une information —
    // en écrire 14 rendrait le graphe illisible, ce qu'on cherche à éviter.
    const marquante = v > 0 && (v === Math.max(...vals) || i === n - 1);
    const val = marquante
      ? `<text x="${(cx + ep / 2).toFixed(1)}" y="${(y(v) - 4).toFixed(1)}" `
      + `text-anchor="middle" class="val">${Math.round(v)}</text>` : '';
    return barre + val;
  }).join('');

  const dates = serie.map((x, i) => (i % 3 === 0 || i === n - 1)
    ? `<text x="${(i * larg + larg / 2).toFixed(1)}" y="${H - 5}" text-anchor="middle" `
      + `class="axe">${x.jour.slice(8)}/${x.jour.slice(5, 7)}</text>` : '').join('');

  return `<svg class="graphe" viewBox="0 0 ${L} ${H}" role="img">`
       + `${reperes}${barres}${dates}</svg>`;
}

// Courbe de poids. Un graphe distinct des barres : le poids est une grandeur
// continue et rare (une mesure tous les quelques jours), pas un cumul quotidien.
// Le tracer en barres suggérerait une valeur pour chaque jour.
function courbePoids(pesees, projection){
  const reels = pesees.filter(w => !w.aberrante);
  if(!reels.length) return '<div class="note">Aucune pesée fiable enregistrée.</div>';
  // Les jours ou la balance a mesure l'impedance. Garmin n'en donne pas : un
  // jour repris du miroir porte `maigre_kg: null`, et null n'est PAS zero — le
  // filtrer ici plutot que le tracer a 0 evite une courbe qui plonge au sol les
  // jours ou l'on s'est simplement pese sans la balance.
  const compo = reels.filter(w => w.maigre_kg != null);

  // ── Marge d'erreur de l'impédancemétrie ─────────────────────────────
  // 2,6 points de masse grasse : borne HAUTE de l'erreur type (SEE) mesurée sur
  // le CHANGEMENT de composition, face à un modèle à quatre compartiments
  // (ADP + DXA + spectroscopie d'impédance).
  //
  //   Siedler MR, Rodriguez C, Stratton MT, Harty PS, Keith DS, Green JJ,
  //   Boykin JR, White SJ, Williams AD, DeHaven B, Tinsley GM.
  //   « Assessing the reliability and cross-sectional and longitudinal validity
  //   of fifteen bioelectrical impedance analysis devices »,
  //   British Journal of Nutrition, 2022.
  //   https://pmc.ncbi.nlm.nih.gov/articles/PMC10404482/
  //   Verbatim : « Standard error of the estimate ranged from 1·7 % to 2·6 % ».
  //
  // ⚠️ Trois limites à ne pas oublier en relisant ce code :
  //   · cette fourchette couvre les QUINZE appareils, elle n'est pas donnée
  //     séparément pour les modèles pieds-pieds. Prendre la borne haute est donc
  //     un choix prudent — et probablement encore optimiste, les auteurs notant
  //     que les pieds-pieds sont les plus mauvais de l'échantillon.
  //   · 37 participants au suivi longitudinal, adultes sains de 19 à 50 ans.
  //   · aucune Kamtron testée : aucune marque de ce prix ne publie de validation.
  //
  // La CONVERSION en kg est de moi, pas de l'article : celui-ci donne une erreur
  // en points de pourcentage de masse grasse. Comme la balance pèse à ±0,3 kg
  // près, l'incertitude sur le pourcentage se reporte telle quelle sur la masse
  // grasse en kg, donc sur la masse maigre — d'où `poids × 2,6 %`.
  //
  // Convertie en kg au poids du jour : la balance pèse à ±0,3 kg près, donc
  // toute l'incertitude de la masse maigre vient de celle du pourcentage.
  //
  // ⚠️ C'est la marge sur l'ÉVOLUTION, pas sur la valeur absolue — celle-ci est
  // bien pire (3 à 7,5 points). Les confondre laisserait croire que « 71,5 kg »
  // est connu à 2 kg près, alors qu'on ignore à peu près tout de sa vraie
  // valeur. Ce que ces barres encadrent, c'est la comparaison d'un point à
  // l'autre — le seul usage défendable de l'appareil.
  const SEE_GRAS_PCT = 2.6;
  const margeKg = w => w.kg * SEE_GRAS_PCT / 100;
  const L = 320, H = 118, g = 26, gd = 6, bas = H - 20, haut = 10;
  // (`projection.trace` n'est plus lue ici : elle décrit la trajectoire depuis
  //  le DERNIER poids, or on trace le plan depuis le premier — voir plus bas.)
  // La masse maigre entre dans le calcul de l'echelle : sans elle, la courbe
  // bleue sortirait par le bas du cadre (~70 kg contre un minimum a 74,4).
  // Les BORNES des barres d'erreur entrent dans l'échelle, pas seulement les
  // points : sinon la barre basse sortirait par le fond du cadre et la marge
  // paraîtrait plus petite qu'elle n'est — l'inverse du but recherché.
  const kgs = [...reels.map(w => w.kg),
               ...compo.flatMap(w => [w.maigre_kg + margeKg(w),
                                      w.maigre_kg - margeKg(w)]),
               projection?.objectif_kg].filter(v => v != null);
  const min = Math.min(...kgs) - .6, max = Math.max(...kgs) + .6;
  const y = kg => bas - (kg - min) / (max - min || 1) * (bas - haut);

  // ── Trajectoire prévue : elle part de la PREMIÈRE pesée ────────────
  // Demande de JB le 13/09/2026 (« je veux qu'elle parte de ma première valeur
  // à 87+ »), et c'est le bon choix : une pointillée ancrée sur le dernier
  // poids connu est tautologique — elle colle forcément à la courbe réelle et
  // ne dit rien. Ancrée sur le poids de DÉPART, elle devient un plan, et l'œil
  // lit immédiatement si le réel est devant ou derrière.
  //
  // On ne peut pas réutiliser `projection.trace` pour ça : le serveur la
  // calcule depuis le dernier poids (82,71 kg en semaine 1, sous les 83,4 du
  // 10/09). La recaler sur 87,1 déformerait ce qu'elle décrit. On retrace donc
  // le plan ici, au `perte_hebdo_kg` que la carte affiche juste au-dessus —
  // même nombre à l'écran et sur la courbe.
  //
  // ⚠️ Conséquence assumée : cette droite touche la cible plus tard que la
  // date annoncée par la carte, parce que la carte compte depuis le poids
  // ACTUEL et la courbe depuis celui de DÉPART. Les deux sont justes, elles ne
  // répondent pas à la même question.
  const depart = reels[0].kg;
  const cibleKg = projection?.objectif_kg;

  // Axe des x en JOURS depuis la première pesée, pour que réel et projeté
  // partagent la même échelle de temps.
  const t0 = new Date(reels[0].jour).getTime();
  // ⚠️ La projection part de la DERNIÈRE pesée, pas de la première — c'est
  // depuis le dernier poids connu qu'on extrapole. Il faut donc son abscisse :
  // `jDernier` est le nombre de jours entre la 1re et la dernière pesée, et
  // c'est l'origine de la courbe pointillée.
  //
  // Deux bugs corrigés ici le 13/09/2026, signalés par JB (« elle part pas de
  // mon premier poids ») :
  //   · le point d'ancrage était `x(0)` — la date de la PREMIÈRE pesée — avec
  //     `y` du poids de la DERNIÈRE. La pointillée démarrait donc sur un point
  //     qui n'a jamais existé : 83,4 kg au 29/08, alors que ce jour-là JB
  //     pesait 87,1. Visuellement, la projection décrochait de la courbe réelle
  //     au lieu d'en repartir.
  //   · `p.semaine * 7` comptait les semaines depuis la première pesée : la
  //     semaine 1 tombait au 05/09 au lieu du 17/09. Toute la trajectoire était
  //     avancée de 12 jours — l'écart entre les deux pesées.
  const jDernier = (new Date(reels[reels.length - 1].jour).getTime() - t0) / 864e5;
  // Abscisse de la date d'objectif annoncée par la carte. La pointillée est
  // tendue entre DEUX points imposés : le poids de départ au jour 0, et la
  // cible à cette date. Elle ne dérive plus d'un rythme, elle relie ce que
  // l'écran promet — c'est ce que JB a demandé le 13/09/2026, après que l'axe
  // daté a rendu visible que la courbe touchait 75 kg un mois après la date
  // écrite juste au-dessus.
  //
  // ⚠️ Conséquence arithmétique, à ne pas découvrir en relisant le code : la
  // pente de cette droite vaut (depart − cible) / durée, soit ~0,75 kg/sem
  // ici, alors que la carte affiche 0,60. Les deux nombres sont justes et ne
  // décrivent pas la même chose — le 0,60 court depuis le poids ACTUEL, la
  // droite depuis celui de DÉPART, et elles arrivent à la même date parce que
  // la seconde part de plus haut. Si un jour le graphe doit afficher le même
  // rythme que la carte, il faudra renoncer à l'une des deux extrémités.
  const jCible = projection?.date
    ? (new Date(projection.date).getTime() - t0) / 864e5 : null;
  const planPossible = projection?.possible && cibleKg != null
                       && jCible != null && jCible > 0 && depart > cibleKg;
  const finJ = Math.max(planPossible ? jCible : 0, jDernier, 14);
  const x = j => g + (j / (finJ || 1)) * (L - g - gd);

  // Une droite : deux points suffisent, et aucun point intermédiaire ne peut
  // prétendre décrire autre chose qu'une interpolation.
  const ligneProj = planPossible
    ? `<polyline class="proj" points="${x(0).toFixed(1)},${y(depart).toFixed(1)} `
      + `${x(jCible).toFixed(1)},${y(cibleKg).toFixed(1)}"/>` : '';

  const ptsReel = reels.map(w =>
    `${x((new Date(w.jour).getTime() - t0) / 864e5).toFixed(1)},${y(w.kg).toFixed(1)}`);
  const ligneReel = reels.length > 1
    ? `<polyline class="reel" points="${ptsReel.join(' ')}"/>` : '';
  // Le rouge marque la DONNÉE inventée, pas la ligne qui la porte. Une
  // composition simulée se pose très bien sur une vraie pesée : peindre en
  // rouge le point de poids ce jour-là ferait passer une mesure réelle pour un
  // faux. Signalé par JB le 14/09/2026 — « les points verts sont TOUS vrais,
  // c'était juste les points bleus les points simulés ». Le serveur tranche en
  // confrontant la date au miroir Garmin (`poids_simule` / `compo_simule`), ce
  // qui ne dépend d'aucun drapeau à maintenir à la main.
  const points = reels.map((w, i) => {
    const [cx, cy] = ptsReel[i].split(',');
    return `<circle class="pt${w.poids_simule ? ' simu' : ''}" cx="${cx}" cy="${cy}" r="3.4"/>`;
  }).join('');

  const cible = projection?.objectif_kg;
  const ligneCible = cible != null && cible >= min && cible <= max
    ? `<line class="cible" x1="${g}" x2="${L}" y1="${y(cible).toFixed(1)}" y2="${y(cible).toFixed(1)}"/>`
      // Étiquette posée à GAUCHE, déplacée là le 14/09/2026. À droite, elle
      // tombe sur le point d'arrivée de la pointillée : celle-ci REJOINT la
      // cible au bord droit du cadre, donc le libellé se superpose forcément à
      // la fin du trait qu'il commente. À gauche, son seul voisin est la
      // graduation de l'axe (x=2, ~13 px de large) et les 29 px la laissent
      // tranquille quelle que soit la donnée.
      + `<text class="etiqCible" x="${g + 3}" y="${(y(cible) - 3).toFixed(1)}" text-anchor="start">${cible} kg</text>`
    : '';

  const axeY = [max - .6, min + .6].map(v =>
    `<text class="axe" x="2" y="${(y(v) + 3).toFixed(1)}">${v.toFixed(1)}</text>`).join('');

  // Axe des abscisses. Il manquait — le graphe montrait une descente sans dire
  // sur combien de temps, ce qui rend la pente illisible : 12 kg en six mois ou
  // en six semaines ne se lisent pas pareil. Signalé par JB le 13/09/2026.
  //
  // Même forme que les deux autres graphes de l'onglet (jj/mm, `class="axe"`,
  // posé à `H - 5`) : les 20 px du bas étaient déjà réservés pour ça et
  // restaient vides ici. Cinq repères — assez pour lire une durée, pas assez
  // pour encombrer une courbe large de 320 unités.
  //
  // Les ancrages des extrémités ne sont pas `middle` : centré, le premier
  // libellé déborderait à gauche du cadre et le dernier à droite, là où la
  // largeur utile s'arrête à `L - 6`.
  const dateAJour = j => {
    const d = new Date(t0 + Math.round(j) * 864e5);
    return `${String(d.getDate()).padStart(2, '0')}/`
         + `${String(d.getMonth() + 1).padStart(2, '0')}`;
  };
  const axeX = [0, .25, .5, .75, 1].map((f, i, tous) => {
    const j = finJ * f;
    const ancre = i === 0 ? 'start' : i === tous.length - 1 ? 'end' : 'middle';
    return `<text class="axe" x="${x(j).toFixed(1)}" y="${H - 5}" `
         + `text-anchor="${ancre}">${dateAJour(j)}</text>`;
  }).join('');

  // ── 2e courbe : la masse MAIGRE, sur le même axe ────────────────────
  // Le poids seul ne distingue pas un kilo de gras d'un kilo de muscle. C'est
  // toute l'utilité de l'impédance — et sur un axe commun, la règle se lit
  // sans commentaire :
  //
  //   verte qui descend + bleue PLATE   → tout ce qui part est du gras ✅
  //   les deux qui descendent ensemble  → de la masse maigre s'en va ⚠️
  //
  // La bande teintée entre les deux courbes n'est pas une décoration : sa
  // hauteur EST la masse grasse (poids − masse maigre), donc elle doit se
  // resserrer. C'est la seule façon de montrer une soustraction sans écrire le
  // résultat quelque part et espérer qu'on le rapproche des courbes.
  const xj = w => x((new Date(w.jour).getTime() - t0) / 864e5);
  const ptsMaigre = compo.map(w => `${xj(w).toFixed(1)},${y(w.maigre_kg).toFixed(1)}`);

  const barres = compo.map(w => {
    const m = margeKg(w), cx = xj(w).toFixed(1);
    const y1 = y(w.maigre_kg + m).toFixed(1), y2 = y(w.maigre_kg - m).toFixed(1);
    return `<line class="marge" x1="${cx}" x2="${cx}" y1="${y1}" y2="${y2}"/>`
         + `<line class="marge" x1="${(+cx - 2.5).toFixed(1)}" x2="${(+cx + 2.5).toFixed(1)}" y1="${y1}" y2="${y1}"/>`
         + `<line class="marge" x1="${(+cx - 2.5).toFixed(1)}" x2="${(+cx + 2.5).toFixed(1)}" y1="${y2}" y2="${y2}"/>`;
  }).join('');
  // Bande = poids à l'aller, masse maigre au retour.
  //
  // Le bord HAUT suit toutes les pesées de l'intervalle, y compris celles sans
  // impédance : c'est du poids mesuré, et le faire passer par les seuls jours
  // à impédance décollerait le haut de la bande de la courbe verte — deux
  // traits à un cheveu l'un de l'autre, dont le lecteur chercherait la
  // différence. Le bord haut EST la courbe verte sur cet intervalle.
  //
  // Le bord BAS, lui, ne peut relier que les jours réellement mesurés : entre
  // deux, c'est une interpolation, et l'intercaler sur un jour Garmin
  // reviendrait à inventer une masse maigre ce jour-là.
  //
  // La bande s'arrête donc à la dernière mesure d'impédance, pas à la dernière
  // pesée — c'est voulu : au-delà, la masse grasse n'est pas connue.
  const jourA = compo.length ? compo[0].jour : null;
  const jourZ = compo.length ? compo[compo.length - 1].jour : null;
  const hautBande = reels.filter(w => w.jour >= jourA && w.jour <= jourZ);
  const bande = compo.length > 1
    ? `<polygon class="bandeGras" points="`
      + hautBande.map(w => `${xj(w).toFixed(1)},${y(w.kg).toFixed(1)}`).join(' ')
      + ' ' + [...ptsMaigre].reverse().join(' ') + `"/>` : '';
  const ligneMaigre = compo.length > 1
    ? `<polyline class="maigreL" points="${ptsMaigre.join(' ')}"/>` : '';
  const pointsMaigre = compo.map((w, i) => {
    const [cx, cy] = ptsMaigre[i].split(',');
    return `<circle class="maigrePt${w.compo_simule ? ' simu' : ''}" cx="${cx}" cy="${cy}" r="3"/>`;
  }).join('');

  // Lecture chiffrée de la dernière mesure. La courbe montre une tendance, pas
  // une valeur : sur un seul point elle ne montre même rien. Le texte, lui,
  // reste juste dès la première pesée — et dit explicitement qu'il n'y en a
  // qu'une, au lieu de laisser croire à une tendance inexistante.
  const der = compo.length ? compo[compo.length - 1] : null;

  // Bilan de la période, CALCULÉ sur les deux mesures extrêmes.
  //
  // ⚠️ La version précédente affichait une règle récitée — « tant que la bleue
  // reste plate pendant que la verte descend, ce que tu perds est du gras ».
  // Le texte était fixe : il s'affichait à l'identique quand la bleue plongeait.
  // Vu le 14/09/2026 en simulant un % de gras constant à la demande de JB : la
  // masse maigre perdait 2,9 kg sur 3,6, sous une phrase qui disait que tout
  // allait bien. Une légende qui rassure le jour où il faut alerter est pire
  // que pas de légende — elle porte l'autorité de l'écran.
  //
  // Le seuil de −0,3 kg sur le poids évite de commenter du bruit de balance ;
  // celui de −0,5 kg sur la masse maigre laisse passer la variation d'eau, à
  // laquelle l'impédancemétrie est très sensible.
  const bilan = compo.length < 2 ? '' : (() => {
    const a = compo[0], z = der;
    const dP = z.kg - a.kg, dM = z.maigre_kg - a.maigre_kg, dG = z.gras_kg - a.gras_kg;
    const sgn = v => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1);
    const depuis = a.jour.split('-').reverse().slice(0, 2).join('/');
    const perteReelle = dP < -.3;
    const partMaigre = perteReelle ? Math.round(dM / dP * 100) : null;
    // Le seuil du verdict est la MARGE MESURÉE de l'appareil, pas un nombre
    // choisi à la main. Tant que l'écart de masse maigre rentre dedans, l'écran
    // se tait : l'annoncer serait lire du bruit à voix haute.
    //
    // `margeKg` n'est PAS multipliée par √2 malgré le fait qu'on compare deux
    // mesures : l'erreur type de l'étude porte déjà sur le CHANGEMENT, elle
    // englobe donc les deux pesées. L'appliquer deux fois doublerait la marge
    // sans raison et ferait taire l'alerte même quand elle est fondée.
    const marge = margeKg(z);
    const lisible = Math.abs(dM) > marge;
    // UNE ligne, pas trois. Le détail chiffré du jour est monté dans l'intitulé
    // du bloc, et la mention « marge de la balance » porte à elle seule l'aveu
    // d'incertitude qui occupait auparavant une phrase entière. Signalé par JB
    // le 14/09/2026 : posée juste au-dessus de la carte de conseil IA, cette
    // note faisait deux pavés de prose collés — le bloc de chiffres se mettait
    // à ressembler au commentaire qui le suit, et lui faisait concurrence.
    return !perteReelle
      ? ` Depuis le ${depuis} : ${sgn(dP)} kg, dont ${sgn(dM)} kg de masse maigre.`
      : !lisible
        ? ` Masse maigre ${sgn(dM)} kg depuis le ${depuis} : sous la marge de `
          + `±${marge.toFixed(1)} kg de la balance, rien à conclure.`
      : dM < 0
        ? ` ⚠️ Masse maigre ${sgn(dM)} kg depuis le ${depuis}, au-delà de la marge `
          + `de ±${marge.toFixed(1)} kg — ${partMaigre} % de ta perte n'est pas du gras.`
        : ` Masse maigre ${sgn(dM)} kg depuis le ${depuis} : ce qui part est bien `
          + `du gras.`;
  })();

  const lecture = !der ? ''
    : `<div class="note">`
      + (compo.length < 2
          ? `Masse maigre ${der.maigre_kg} kg. Une seule mesure : la courbe bleue `
            + `démarrera à la deuxième.`
          : bilan.trim())
      + `</div>`;

  return `<svg class="graphe" viewBox="0 0 ${L} ${H}" role="img">`
       + `${bande}${ligneCible}${ligneProj}${ligneReel}${points}`
       + `${barres}${ligneMaigre}${pointsMaigre}${axeY}${axeX}</svg>`
       + `<div class="leg"><span><i class="tRee"></i>poids</span>`
       + `<span><i class="tProj"></i>trajectoire prévue</span>`
       + (compo.length
           ? `<span><i class="tMaigre"></i>masse maigre</span>`
             + (compo.length > 1 ? `<span><i class="tBande"></i>masse grasse</span>` : '')
           : '')
       + (compo.length ? `<span><i class="tMarge"></i>marge d'erreur</span>` : '')
       + (reels.some(w => w.poids_simule || w.compo_simule)
           ? `<span><i class="tSimu"></i>valeurs simulées</span>` : '')
       + `</div>` + lecture;
}

// Jauge de progression vers l'objectif. Elle ne mesure PAS la même chose que
// les jauges du journal (avancement dans une journée) : ici c'est le chemin
// parcouru entre le poids de départ et la cible. Elle reste donc à zéro tant
// qu'une deuxième pesée n'existe pas — et c'est l'information, pas un défaut.
function jaugeObjectif(pr){
  const dep = pr.depart_initial_kg ?? pr.depart_kg, cur = pr.depart_kg, cib = pr.objectif_kg;
  if(dep == null || cib == null || dep <= cib) return '';
  const fait = Math.max(0, dep - cur), total = dep - cib;
  const pct = Math.min(100, fait / total * 100);
  return `<div class="jauge" style="margin-top:12px">`
       + `<span class="lib">Parcouru</span>`
       + `<span class="piste"><span class="barre ${pct >= 99 ? 'atteint' : ''}" `
       + `style="width:${pct.toFixed(1)}%"></span></span>`
       + `<span class="val">${fait.toFixed(1)} / ${total.toFixed(1)} kg</span></div>`;
}

async function chargeTendances(){
  const [st, ins] = await Promise.all([
    (await fetch('api/stats?jours=30')).json(),
    (await fetch('api/insights')).json(),
  ]);
  const q14 = st.serie.slice(-14);
  const pr = st.projection || {};
  const conseils = [...(ins.insights || [])];
  // Le titre est SORTI de la carte : c'est la même liste groupée que le
  // journal, et deux écrans de la même app ne peuvent pas ranger leur intitulé
  // à deux endroits différents.
  const bloc = (titre, corps, extra = '') =>
    `<div class="repasGrp"><h2 class="sect"><span>${titre}</span>${extra}</h2>`
    + `<div class="bloc">${corps}</div></div>`;

  // Un conseil est consommé APRÈS chaque bloc de chiffres. S'il n'en reste
  // plus, on n'insère rien : mieux vaut trois blocs commentés et deux nus que
  // cinq commentaires dont deux inventés pour remplir.
  const conseil = () => {
    const i = conseils.shift();
    if(!i) return '';
    // Même charpente qu'un bloc de graphe — un groupe, un intitulé, une carte —
    // avec un intitulé VIDE. C'est ce qui aligne le conseil sur la carte qu'il
    // commente et non sur le titre de celle-ci : les deux colonnes du desktop
    // ont la même structure, donc les mêmes hauteurs de départ, sans le moindre
    // décalage à maintenir à la main. L'espace insécable donne à l'intitulé
    // vide la hauteur d'une ligne de texte ; `aria-hidden` évite d'annoncer un
    // titre vide à un lecteur d'écran.
    return `<div class="repasGrp conseilGrp">`
         + `<h2 class="sect" aria-hidden="true">&nbsp;</h2>`
         + `<div class="bloc conseilBloc"><div class="ins ${esc(i.ton)}">`
         + `<b>${esc(i.titre)}</b><p>${esc(i.corps)}</p>`
         + (i.action ? `<span class="act">→ ${esc(i.action)}</span>` : '')
         + `</div></div></div>`;
  };

  const parts = [];

  // ── 1. Objectif : la question à laquelle tout le reste sert de preuve ──
  const p1 = pr.prevue || {};
  const pm = pr.mesuree || {};
  const jour = iso => new Date(iso).toLocaleDateString('fr-FR',
    {day:'numeric', month:'short', year:'numeric'});

  // L'écart entre prévu et mesuré est signalé visuellement dès qu'il dépasse
  // 40 % : c'est le moment où « je suis un peu à côté » devient « je ne fais
  // pas ce que je crois faire ». Un tableau qui présente les deux du même ton
  // laisserait passer un facteur 2,5 sans que rien n'accroche l'œil.
  const derape = pm.possible && p1.possible
    && Math.abs(pm.perte_hebdo_kg - p1.perte_hebdo_kg) / p1.perte_hebdo_kg > .4;

  parts.push(`<div class="bloc heros"><h2>Objectif ${pr.objectif_kg ?? '—'} kg</h2>`
    + (p1.possible
        ? `<div class="grandChiffre">${jour(p1.date)}</div>`
          + `<div class="sousChiffre">au rythme prévu · ${p1.semaines} semaines</div>`
          + jaugeObjectif(pr)
        : `<div class="note">${esc(p1.raison || 'Projection impossible.')}</div>`)
    + `<div class="duo">`
      + `<div><div class="quoi">Rythme prévu</div>`
        + (p1.possible
            ? `<div class="val">${p1.perte_hebdo_kg.toFixed(2)} kg<span style="font-size:12px;font-weight:400">/sem</span></div>`
              + `<div class="det">déficit ${pr.deficit_cible ?? 850} kcal/j<br>${jour(p1.date)}</div>`
            : `<div class="absent">—</div>`)
      + `</div>`
      + `<div class="${derape ? 'ecart' : ''}"><div class="quoi">Rythme mesuré</div>`
        + (pm.possible
            ? `<div class="val">${pm.perte_hebdo_kg.toFixed(2)} kg<span style="font-size:12px;font-weight:400">/sem</span></div>`
              + `<div class="det">déficit réel ${pr.deficit_mesure_kcal} kcal/j<br>${jour(pm.date)}</div>`
            : `<div class="absent">${esc((pm.raison || 'pas encore calculable').replace(/\.$/, ''))}</div>`)
      + `</div>`
    + `</div>`
    + (derape
        ? `<div class="note">⚠️ Ton rythme réel est <b>${(pm.perte_hebdo_kg / p1.perte_hebdo_kg).toFixed(1)}×</b> `
          + `celui que tu vises. La date de gauche est ton plan, celle de droite est ce que `
          + `tes données décrivent — et un écart de cette taille se paie en masse maigre.</div>`
        : `<div class="note">La date prévue tient compte du fait que le déficit se referme `
          + `en maigrissant : 850 kcal/j à 87 kg, 650 à 77. Une projection linéaire annoncerait `
          + `environ 3 semaines de moins — à tort.</div>`)
    // ⚠️ Ce `</div>` fermait `<div class="bloc heros">` et il MANQUAIT. Le
    // navigateur refermait donc la carte tout seul à la fin du conteneur, ce
    // qui imbriquait TOUT le reste de la page dedans : 4 groupes et 9 blocs
    // enfants de la carte Objectif, qui mesurait 2298 px de haut au lieu de
    // ~350, et `#tendCorps` n'avait que 2 enfants sur 8. Le défaut est resté
    // invisible tant que les blocs avaient une bordure ; en liste groupée, le
    // fond de la carte Objectif court derrière toute la page. Corrigé le
    // 13/09/2026.
    + `</div>`);
  parts.push(conseil());

  // ── 2. Poids ──
  // Les chiffres du jour vont dans l'INTITULÉ, pas sous le graphe — même
  // emplacement que « moy. 7 j » sur les graphes d'apport et de protéines.
  // Deux écrans de la même app ne peuvent pas ranger la même information à
  // deux endroits différents, et ça libère la note pour le seul verdict.
  const derCompo = [...(st.calibration.pesees || [])]
    .filter(w => !w.aberrante && w.gras_pct != null).pop();
  parts.push(bloc('Poids réel et trajectoire',
    courbePoids(st.calibration.pesees, {...p1, objectif_kg: pr.objectif_kg}),
    derCompo ? `<span class="h2val">${derCompo.gras_pct} % de gras `
               + `· ${derCompo.maigre_kg} kg maigre</span>` : ''));
  parts.push(conseil());

  // ── 3. Apport ──
  parts.push(bloc('Apport', graphe(q14, 'kcal', st.cibles.kcal, 'kcal')
    + `<div class="leg"><span><i class="cAtt"></i>cible atteinte</span>`
    + `<span><i class="cSous"></i>sous la cible</span>`
    + `<span><i class="cDoute"></i>saisie incomplète</span></div>`,
    `<span class="h2val">moy. 7 j ${st.moyennes.kcal_7j ?? '—'} kcal</span>`));
  parts.push(conseil());

  // ── 4. Protéines ──
  parts.push(bloc('Protéines', graphe(q14, 'proteines', st.cibles.proteines, 'g'),
    `<span class="h2val">moy. 7 j ${st.moyennes.proteines_7j ?? '—'} g</span>`));
  parts.push(conseil());

  // ── 5. Qualité de saisie — en dernier : c'est la note de bas de page qui
  //     dit à quel point tout ce qui précède est solide. ──
  const sa = st.saisie;
  parts.push(bloc('Fiabilité des données',
      `<div class="jauge"><span class="lib">Complets</span><span class="val">${sa.jours_complets} j</span></div>`
    + `<div class="jauge"><span class="lib">Déclarés incomplets</span><span class="val">${sa.jours_declares_incomplets} j</span></div>`
    + `<div class="jauge"><span class="lib">Vides</span><span class="val">${sa.jours_vides} j</span></div>`
    + `<div class="note">${esc(sa.note)}`
    + (st.premier_jour_saisi
        ? ` Première saisie le ${st.premier_jour_saisi.split('-').reverse().join('/')} — `
          + `les jours vides d'avant ne sont pas des oublis.` : '')
    + `</div>`));

  // Les conseils qui n'ont pas trouvé de place vont à la fin plutôt que d'être
  // jetés : ils sont classés par importance, en perdre un serait perdre le moins
  // urgent, mais les perdre en silence serait pire.
  while(conseils.length) parts.push(conseil());

  $('#tendCorps').innerHTML = parts.filter(Boolean).join('');

  // Âge de l'analyse. Il se CALCULE ici : l'API renvoie `genere_a`, jamais
  // `age_h` — que ce code lisait quand même, d'où le « il y a NaN j » affiché
  // en pied de page (undefined < 24 est faux, on partait donc dans la branche
  // des jours et undefined/24 vaut NaN). Un champ absent ne lève rien en JS,
  // il traverse le calcul et ressort en toutes lettres à l'écran.
  const ageH = (() => {
    if(!ins.genere_a) return null;
    const t = new Date(ins.genere_a).getTime();     // sans suffixe Z : heure locale
    return Number.isNaN(t) ? null : (Date.now() - t) / 36e5;
  })();

  $('#tendCorps').insertAdjacentHTML('beforeend',
    `<div class="note" style="text-align:center;padding:4px 0 10px">`
    + (ageH === null
        ? `Analyse pas encore générée`
        : `Analyse générée ${ageH < 24 ? 'il y a ' + Math.round(ageH) + ' h'
                                       : 'il y a ' + Math.floor(ageH/24) + ' j'}`)
    + `</div>`);
}

const VUES = [['journal', '#vueJournal', '#ongJournal', 'Journal'],
              ['routine', '#vueRoutine', '#ongRoutine', 'Routine'],
              ['tendances', '#vueTend', '#ongTend', 'Tendances']];
function montre(v){

    $(cible).hidden = nom !== v;
    $(onglet).classList.toggle('on', nom === v);
  });
  // Le grand titre NOMME l'écran affiché. C'est toute sa fonction sur iOS, et
  // ce n'est pas cosmétique : le titre est la seule chose qui reste lisible une
  // fois la barre repliée, quand la pastille d'onglet est hors du champ de
  // vision en bas de l'écran. Il disait « Journal » sur les trois onglets —
  // invisible tant qu'il faisait 25 px dans un bandeau, criant à 30 px posé
  // au-dessus d'un graphe de tendances.
  const titre = (VUES.find(([nom]) => nom === v) || [])[3];
  if(titre) document.title = $('header h1').textContent = titre;
  // Le bouton d'ajout appartient au journal : on n'ajoute pas un aliment depuis
  // un graphe de deux semaines, et l'onglet Routine a son propre bouton — qui
  // n'écrit d'ailleurs pas au même endroit.
  $('#fab').style.display = v === 'journal' ? '' : 'none';
  // Rechargé à CHAQUE affichage, jamais mis en cache : la routine change depuis
  // le journal (📌, suppression d'une ligne validée) et les tendances depuis le
  // cron de la nuit. Une liste figée sur l'état d'il y a trois onglets est pire
  // qu'un rechargement d'une requête.
  if(v === 'tendances') chargeTendances();
  if(v === 'routine') chargeRoutine();
}

  const d = new Date(jourVu + 'T12:00:00');
  d.setDate(d.getDate() + n);
  jourVu = isoLocal(d);
  chargeJour();
};
$('#prec').onclick = () => decale(-1);

$('#rafraichir').onclick = () => chargeJour();

// ── Balayage horizontal pour changer de jour ──────────────────────────────
//
// Trois conditions avant de déclencher, et chacune répare un geste raté :
//
// 1. **L'horizontal doit dominer.** Un pouce ne trace jamais une ligne droite :
//    un scroll vertical part toujours un peu de travers. Sans le rapport 2:1,
//    la liste changerait de jour pendant qu'on la fait défiler — et on perdrait
//    sa place sans comprendre pourquoi.
// 2. **60 px minimum.** En dessous, c'est une hésitation, pas une intention.
// 3. **Les bornes des flèches font foi.** On relit `disabled` plutôt que de
//    redériver la règle : deux copies d'une même limite finissent par diverger,
//    et on se retrouverait à naviguer vers un jour que les boutons interdisent.
//
// Un balayage qui bute sur une borne ne fait rien, volontairement : pas
// d'animation d'échec. L'absence de mouvement est déjà la réponse.
(() => {
  const SEUIL = 60, DOMINANCE = 2;
  let x0 = null, y0 = null;

  addEventListener('touchstart', e => {
    // Un seul doigt : à deux, c'est un zoom ou un geste système.
    // Et jamais depuis une boîte de dialogue ouverte, où le balayage
    // appartient au contenu de la boîte.
    if(e.touches.length !== 1 || vue !== 'journal' || document.querySelector('dialog[open]')){
      x0 = null; return;
    }
    x0 = e.touches[0].clientX;
    y0 = e.touches[0].clientY;
  }, {passive: true});

  addEventListener('touchend', e => {
    if(x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    const dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if(Math.abs(dx) < SEUIL || Math.abs(dx) < Math.abs(dy) * DOMINANCE) return;
    // Vers la gauche = on avance dans le temps, comme on tourne une page.
    const bouton = dx < 0 ? $('#suiv') : $('#prec');
    if(!bouton.disabled) decale(dx < 0 ? 1 : -1);
  }, {passive: true});
})();

// ─────────────────────────────────────────────── Scan de code-barres
// Deux modes, choisis automatiquement :
//   · origine sécurisée (HTTPS ou localhost) → flux vidéo, scan continu ;
//   · sinon → photo unique via le champ fichier, qui lui marche en HTTP.
// Le navigateur interdit getUserMedia hors origine sécurisée : ce n'est pas
// contournable, c'est une règle de sécurité. Le mode photo est donc le seul
// chemin viable tant que le service reste en http:// sur le réseau local.
const SECURISE = window.isSecureContext;
let lecteur = null, flux = null;

function etat(t){ $('#etat').textContent = t || ''; }

function zxing(){
  if(!window.ZXing){ etat('Décodeur indisponible'); return null; }
  if(!lecteur){
    // On restreint aux formats d'emballage alimentaire : moins de faux
    // positifs et un décodage nettement plus rapide qu'en cherchant tout.
    const F = ZXing.BarcodeFormat, H = new Map();
    H.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,
          [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128]);
    H.set(ZXing.DecodeHintType.TRY_HARDER, true);
    lecteur = new ZXing.MultiFormatReader();
    lecteur.setHints(H);
  }
  return lecteur;
}

$('#scan').onclick = () => SECURISE ? directBascule() : $('#photo').click();

// ── Mode photo (HTTP) ──
$('#photo').onchange = async e => {
  const f = e.target.files?.[0];
  e.target.value = '';                  // permet de reprendre la même photo
  if(!f) return;
  etat('Lecture du code…');
  try{
    const code = await decodeImage(f);
    if(code){ etat('Code ' + code); $('#q').value = code; chercher(code); }
    else etat('Aucun code-barres lisible — recadre plus près, bien à plat');
  }catch(err){ etat('Échec de lecture : ' + err.message); }
};

async function decodeImage(fichier){
  const url = URL.createObjectURL(fichier);
  try{
    const img = await new Promise((ok, ko) => {
      const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = url;
    });
    const r = zxing(); if(!r) return null;
    // Une photo d'iPhone fait plusieurs milliers de pixels de large. On la
    // réduit : au-delà de ~1600 px le décodage ralentit sans gagner en fiabilité.
    const max = 1600, ech = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * ech); c.height = Math.round(img.height * ech);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return lisCanvas(c);
  } finally { URL.revokeObjectURL(url); }
}

function lisCanvas(c){
  // On tente plusieurs orientations. ZXing balaie l'image par lignes
  // horizontales : un code-barres photographié en portrait est donc
  // invisible pour lui tant qu'on ne l'a pas redressé.
  // La rotation intégrée de ZXing (`rotateCounterClockwise`) ne fonctionne pas
  // ici — testé le 2026-08-30, échec sur une image pivotée de 90°. On fait donc
  // tourner le canvas nous-mêmes : plus verbeux, mais ça marche et on le
  // vérifie. Ordre choisi par probabilité : la plupart des photos sont droites.
  for(const angle of [0, 90, 270, 180]){
    const t = tourne(c, angle);
    const d = t.getContext('2d').getImageData(0, 0, t.width, t.height);
    try{
      const bitmap = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(
        new ZXing.RGBLuminanceSource(luminance(d), t.width, t.height)));
      const r = zxing().decode(bitmap);
      if(r?.getText()) return r.getText();
    }catch(_){ }
    finally{ try{ lecteur.reset(); }catch(_){ } }
  }
  return null;
}

function tourne(c, angle){
  if(!angle) return c;
  const droit = angle % 180 !== 0;
  const o = document.createElement('canvas');
  o.width  = droit ? c.height : c.width;
  o.height = droit ? c.width  : c.height;
  const x = o.getContext('2d');
  x.translate(o.width / 2, o.height / 2);
  x.rotate(angle * Math.PI / 180);
  x.drawImage(c, -c.width / 2, -c.height / 2);
  return o;
}

function luminance(imgData){
  // ZXing attend un tableau de luminance, pas du RGBA.
  const p = imgData.data, out = new Uint8ClampedArray(p.length / 4);
  for(let i = 0, j = 0; i < p.length; i += 4, j++)
    out[j] = (p[i] * 0.299 + p[i+1] * 0.587 + p[i+2] * 0.114) | 0;
  return out;
}

// ── Mode direct (HTTPS uniquement) ──
async function directBascule(){
  if(flux) return directArret();
  try{
    flux = await navigator.mediaDevices.getUserMedia(
      {video:{facingMode:'environment', width:{ideal:1280}}});
  }catch(e){ etat('Caméra refusée : ' + e.name); return; }
  const v = $('#flux');
  // C'est le VISEUR (vidéo + réticule) qu'on affiche, pas la vidéo seule :
  // sinon le réticule resterait posé sur un cadre noir vide une fois le flux
  // coupé. La vidéo, elle, est toujours `display:block` dans son cadre.
  v.srcObject = flux; $('#viseur').style.display = 'block'; await v.play();
  etat('Vise le code-barres…');
  const c = document.createElement('canvas');
  const boucle = () => {
    if(!flux) return;
    if(v.videoWidth){
      // On décode l'IMAGE ENTIÈRE, pas la zone du réticule : le cadre est une
      // aide au cadrage, pas une contrainte. Restreindre au cadre couperait un
      // code tenu un peu de travers (le réticule n'a que 52 % de la hauteur) et
      // `object-fit: cover` rogne déjà ce que l'écran montre — la caméra voit
      // plus large que le viseur, autant s'en servir.
      c.width = v.videoWidth; c.height = v.videoHeight;
      c.getContext('2d').drawImage(v, 0, 0);
      const code = lisCanvas(c);
      if(code){
        directArret(); etat('Code ' + code);
        $('#q').value = code; chercher(code); return;
      }
    }
    requestAnimationFrame(boucle);
  };
  requestAnimationFrame(boucle);
}

function directArret(){
  flux?.getTracks().forEach(t => t.stop());
  flux = null;
  const v = $('#flux'); v.srcObject = null;
  $('#viseur').style.display = 'none';
}

if(!SECURISE)
  $('#scan').title = 'Photo du code-barres (scan continu : nécessite HTTPS)';

// ─────────────────────────────────────────────── aliment maison
const MCHAMPS = ['energie_kcal','proteines','glucides','sucres','lipides','fibres','sel'];
let mMode = '100';           // '100' = valeurs pour 100 g · 'portion' = pour la portion

function mDessineMode(){
  $('#mMode').innerHTML = [['100','pour 100 g'],['portion','pour la portion']]
    .map(([c,l]) => `<button data-m="${c}" class="${c === mMode ? 'on' : ''}">${l}</button>`)
    .join('');
  $('#mMode').querySelectorAll('button').forEach(b => b.onclick = () => {
    mMode = b.dataset.m;
    $('#mPoidsLigne').style.display = mMode === 'portion' ? '' : 'none';
    mDessineMode(); mApercu();
  });
}

/** Ramène la saisie à des valeurs pour 100 g — la seule convention du serveur. */
function mPour100(){
  const lu = k => {
    const v = $('#m_' + k).value.trim();
    return v === '' ? null : parseFloat(v.replace(',', '.'));
  };
  const vals = {};
  MCHAMPS.forEach(k => vals[k] = lu(k));
  if(mMode === 'portion'){
    const poids = parseFloat(($('#mPoids').value || '').replace(',', '.'));
    if(!(poids > 0)) return null;
    MCHAMPS.forEach(k => {
      if(vals[k] != null) vals[k] = vals[k] / poids * 100;
    });
  }
  return vals;
}

function mApercu(){
  const v = mPour100();
  const kc = v && v.energie_kcal != null ? v.energie_kcal : null;
  if(kc == null){ $('#mApercu').textContent = ''; return; }
  let t = `${Math.round(kc)} kcal pour 100 g`;
  if(mMode === 'portion'){
    const poids = parseFloat(($('#mPoids').value || '').replace(',', '.'));
    if(poids > 0) t += ` · ta portion de ${Math.round(poids)} g sera pré-remplie`;
  }
  // Le serveur refuse au-delà de 900 kcal/100 g (plus que l'huile pure). On le
  // dit AVANT l'envoi : à ce stade l'erreur est presque toujours d'avoir saisi
  // le total sans basculer le sélecteur, et c'est réparable en un clic.
  if(kc > 900) t += '  ⚠️ au-dessus de l\'huile pure — mauvais mode ?';
  $('#mApercu').textContent = t;
}

$('#maison').onclick = () => {
  $('#mNom').value = $('#q').value.trim();   // reprend ce qui a été tapé
  MCHAMPS.forEach(k => $('#m_' + k).value = '');
  mMode = '100';
  $('#mPoidsLigne').style.display = 'none';
  mDessineMode(); mApercu();
  $('#dlgM').showModal();
};
$('#mAnnuler').onclick = () => $('#dlgM').close();
['#mPoids', ...MCHAMPS.map(k => '#m_' + k)]
  .forEach(sel => $(sel).oninput = mApercu);

$('#mValider').onclick = async () => {
  const nom = $('#mNom').value.trim();
  if(nom.length < 2){ $('#mApercu').textContent = 'Il manque le nom.'; return; }
  const v = mPour100();
  if(!v){ $('#mApercu').textContent = 'Poids de la portion manquant.'; return; }
  if(v.energie_kcal == null){ $('#mApercu').textContent = 'Il manque les kcal.'; return; }
  const poidsPortion = mMode === 'portion'
    ? parseFloat(($('#mPoids').value || '').replace(',', '.')) : null;
  try{
    const r = await fetch('api/manuel', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({nom, ...v})});
    const d = await r.json();
    if(!r.ok){ $('#mApercu').textContent = d.detail || 'Refusé par le serveur'; return; }
    $('#dlgM').close();
    // Enchaîner sur la fiche de grammage : le besoin qui a fait naître ce
    // formulaire était « pour ce midi ». Créer l'aliment sans pouvoir le
    // manger dans le même geste manquerait la moitié du sujet.
    ouvre(d.aliment);
    if(poidsPortion > 0){ $('#g').value = Math.round(poidsPortion); majApercu(); }
  }catch(_){ $('#mApercu').textContent = 'Serveur injoignable'; }
};

chargeJour();
</script>
